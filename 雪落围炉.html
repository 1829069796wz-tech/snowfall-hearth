    if (S.Scene && S.Scene.setHots) S.Scene.setHots(HOTS);
  }

  function txt(id, s) {
    var e = G.el[id];
    if (e) e.textContent = s == null ? '' : s;
  }

  /* ---------------- 文案 ---------------- */
  function applyCopy() {
    var el = G.el;
    txt('t-title', COPY.title || '雪落围炉');
    txt('t-sub', COPY.subtitle || '');
    txt('t-tag', COPY.tagline || '');
    txt('t-hint', COPY.startHint || '');
    var h = COPY.howto || {};
    txt('h-title', h.title || '守炉须知');
    txt('h-note', h.note || '');
    if (el['h-steps'] && h.steps) {
      el['h-steps'].innerHTML = '';
      for (var i = 0; i < h.steps.length; i++) {
        var li = document.createElement('li');
        li.setAttribute('data-n', i + 1);
        var raw = h.steps[i];
        var parts = raw.split('——');
        var head2 = parts[0];
        var cut = head2.indexOf('：') >= 0 ? head2.indexOf('：') : head2.indexOf('·');
        if (cut > 0) {
          var bolded = '<b>' + esc(head2.slice(0, cut).trim()) + '</b>' +
            esc(head2.slice(cut).trim());
          li.innerHTML = parts.length > 1 ? bolded + '——' + esc(parts.slice(1).join('——')) : bolded;
        } else {
          li.textContent = parts.length > 1 ? parts.join('——') : raw;
        }
        el['h-steps'].appendChild(li);
      }
    }
    var hud = COPY.hud || {};
    txt('lb-warmth', hud.warmth || '温暖');
    txt('lb-fire', hud.fire || '炉火');
    txt('lb-snow', hud.snow || '积雪');
    txt('k-title', COPY.knowledgeTitle || '小雪小识');
    if (el['k-list'] && COPY.knowledge) {
      el['k-list'].innerHTML = '';
      for (var k = 0; k < COPY.knowledge.length; k++) {
        var li2 = document.createElement('li');
        li2.textContent = COPY.knowledge[k];
        el['k-list'].appendChild(li2);
      }
    }
    txt('e-cred', COPY.credits || '');
    txt('btn-learn', COPY.knowledgeTitle || '小雪小识');
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function buildRounds() {
    var box = G.el.rounds;
    if (!box) return;
    box.innerHTML = '';
    for (var i = 0; i < TOTAL_ROUNDS; i++) {
      var d = document.createElement('i');
      box.appendChild(d);
    }
  }

  /* ---------------- 绑定 ---------------- */
  function bind() {
    var el = G.el;
    on(el['btn-start'], 'click', function () { click(); G.phase = 'howto'; G.syncScreens(); });
    on(el['btn-howto-back'], 'click', function () { click(); G.phase = 'title'; G.syncScreens(); });
    on(el['btn-howto-go'], 'click', function () { click(); G.startGame(); });
    on(el['btn-frame-next'], 'click', function () { click(); G.frameNext(); });
    on(el['btn-resume'], 'click', function () { click(); G.setPaused(false); });
    on(el['btn-quit'], 'click', function () { click(); G.setPaused(false); G.toTitle(); });
    on(el['btn-pause'], 'click', function () { click(); G.setPaused(!G.paused); });
    on(el['btn-sound'], 'click', function () { click(); G.toggleMute(); });
    on(el['btn-know-close'], 'click', function () { click(); G.closeKnow(); });
    on(el['btn-learn'], 'click', function () { click(); G.openKnow(); });

    /* 键盘 */
    document.addEventListener('keydown', function (e) {
      var k = (e.key || '').toLowerCase();
      if (k === 'm') { if (!e.repeat) G.toggleMute(); return; }
      if (e.repeat) return;
      if (k === 'escape' || k === 'p') {
        if (G.knowOpen) { G.closeKnow(); return; }
        if (G.phase === 'playing' || G.phase === 'pause') G.setPaused(!G.paused);
        return;
      }
      if (G.knowOpen || G.paused) return;
      if (G.phase === 'title') {
        if (k === ' ' || k === 'enter') { e.preventDefault(); G.phase = 'howto'; G.syncScreens(); }
        return;
      }
      if (G.phase === 'howto') {
        if (k === ' ' || k === 'enter') { e.preventDefault(); G.startGame(); }
        return;
      }
      if (G.phase === 'frame') {
        if (k === ' ' || k === 'enter') { e.preventDefault(); G.frameNext(); }
        return;
      }
      if (G.phase === 'end') {
        if (!G.endShown) return;      /* 天亮的那两秒别被空格跳过 */
        if (k === 'r' || k === ' ' || k === 'enter') { e.preventDefault(); G.startGame(); }
        return;
      }
      if (G.phase === 'playing') {
        if (k === 'a' || k === '1') G.addWood();
        else if (k === 's' || k === '2') G.shovel();
        else if (k === 'd' || k === '3') G.fetchWood();
        else if (k === 'g' || k === '5') G.toggleDoor();
        else if (k === 'f' || k === '4' || k === ' ') { e.preventDefault(); G.flipCake(); }
      }
    });

    /* 画布交互 */
    var cv = G.el.cv || document.getElementById('cv');
    G.el.cv = cv;
    cv.addEventListener('pointerdown', function (e) {
      if (e.button !== undefined && e.button > 0) return;
      var p = G.toStage(e.clientX, e.clientY);
      G.pointer(p.x, p.y);
    });
    cv.addEventListener('pointermove', function (e) {
      var p = G.toStage(e.clientX, e.clientY);
      var h = hit(p.x, p.y);
      G.hover = h ? h.id : null;
      G.hoverLabel = h ? (LABELS[h.id] || '') : '';
      cv.style.cursor = h && G.phase === 'playing' && !G.paused ? 'pointer' : 'default';
    });
    cv.addEventListener('pointerleave', function () { G.hover = null; });

    window.addEventListener('blur', function () {
      if (G.phase === 'playing' && !G.paused && !G.knowOpen) G.setPaused(true);
    });
    document.addEventListener('visibilitychange', function () {
      if (document.hidden && G.phase === 'playing' && !G.paused && !G.knowOpen) G.setPaused(true);
    });
  }

  function on(elm, ev, fn) {
    if (elm) elm.addEventListener(ev, fn);
  }

  function click() { if (S.Audio) S.Audio.uiClick(); }

  G.toStage = function (cx, cy) {
    var cv = G.el.cv;
    var r = cv.getBoundingClientRect();
    return {
      x: (cx - r.left) / (r.width || 1) * 1280,
      y: (cy - r.top) / (r.height || 1) * 720
    };
  };

  function hit(x, y) {
    for (var i = 0; i < HOTS.length; i++) {
      var h = HOTS[i];
      if (!h.active) continue;
      if (h.kind === 'circle') {
        var dx = x - h.x, dy = y - h.y;
        if (dx * dx + dy * dy <= h.r * h.r) return h;
      } else if (U.inRect(x, y, h)) return h;
    }
    return null;
  }

  /* ---------------- 屏幕切换 ---------------- */
  G.syncScreens = function () {
    var el = G.el;
    var map = {
      title: 'scr-title', howto: 'scr-howto', frame: 'scr-frame',
      end: 'scr-end', pause: 'scr-pause'
    };
    var target = G.knowOpen ? 'scr-know' : (G.paused ? 'scr-pause' : (map[G.phase] || null));
    var ids = ['scr-title', 'scr-howto', 'scr-frame', 'scr-end', 'scr-know', 'scr-pause'];
    for (var i = 0; i < ids.length; i++) {
      var node = el[ids[i]];
      if (node) node.classList.toggle('show', ids[i] === target);
    }
    var playing = (G.phase === 'playing' || G.phase === 'pause') && !G.knowOpen;
    if (el.hud) el.hud.classList.toggle('show', playing);
    if (el['btn-learn']) {
      el['btn-learn'].classList.toggle('show', G.phase !== 'howto' && G.phase !== 'frame');
    }
    if (el.hintbar) el.hintbar.classList.toggle('show', G.phase === 'playing' && !G.paused);
  };

  G.setPaused = function (p) {
    if (G.phase !== 'playing' && G.phase !== 'pause') return;
    G.paused = !!p;
    if (p) {
      G.phase = 'pause';
      txt('p-note', (COPY.tips && COPY.tips.length)
        ? COPY.tips[(Math.random() * COPY.tips.length) | 0] : '火在烧，雪在下。');
      if (S.Audio) S.Audio.setWeather(0, G.fire);
    } else {
      G.phase = 'playing';
    }
    G.syncScreens();
  };

  G.openKnow = function () {
    G.knowOpen = true;
    G.syncScreens();
  };
  G.closeKnow = function () {
    G.knowOpen = false;
    G.syncScreens();
  };
  G.toggleMute = function () {
    if (!S.Audio) return;
    S.Audio.init();
    S.Audio.setMuted(!S.Audio.muted);
    var b = G.el['btn-sound'];
    if (b) b.classList.toggle('off', !!S.Audio.muted);
    if (!S.Audio.muted) S.Audio.uiClick();
  };

  /* ---------------- 生命周期 ---------------- */
  G.reset = function () {
    G.round = 0;
    G.roundT = 0;
    G.roundDur = ROUND_DUR[0];
    G.warmth = 82;
    G.minWarmth = 100;
    G.fire = 46;
    G.snow = 0;
    G.wood = 4;
    G.cakeT = 0; G.cakeCd = 0; G.cakeBurnt = false; G.cakeReady = false;
    G.catShow = false; G.catPetT = 0; G.catTimer = 6;
    G.doorAjar = false; G.doorVis = 0;
    G.knockT = 0; G.knockTimer = 26;
    G.combo = 0; G.comboBest = 0;
    G.gustT = 0; G.eventTimer = 9;
    G.dawnT = 0; G.shakeAmp = 0;
    G.shovelCd = 0;
    G.endDelay = 0; G.endShown = false; G.isWin = false;
    G.frameIdle = 0;
    G.floaters.length = 0;
    G.fetching = false; G.fetchP = 0; G.fetchPicked = false;
    G.paused = false;
    G.stats = { wood: 0, cake: 0, perfect: 0, shovel: 0, pets: 0, gusts: 0, closed: 0, guests: 0 };
    G.char.x = L.char.x; G.char.stand = 0; G.char.arm = 0;
    G.char.lean = 0; G.char.hold = 0; G.char.mode = 'idle'; G.char.t = 0;
    hideToast();
    updateHUD();
  };

  G.toTitle = function () {
    G.phase = 'title';
    G.paused = false;
    G.knowOpen = false;
    G.reset();
    G.phase = 'title';
    G.warmth = 72; G.fire = 32; G.snow = 44; G.wood = 5;
    G.catShow = true;
    if (S.Audio && S.Audio.up) S.Audio.up();
    G.syncScreens();
    hideToast();
  };

  G.startGame = function () {
    G.reset();
    if (S.Audio) { S.Audio.init(); S.Audio.start(); }
    G.phase = 'playing';
    G.paused = false;
    G.knowOpen = false;
    G.startRound(0);
    G.syncScreens();
  };

  G.startRound = function (i) {
    G.round = i;
    G.roundT = 0;
    G.roundDur = ROUND_DUR[i];
    G.phase = 'playing';
    G.eventTimer = 9 + U.rand(0, 6);
    if (i === 1) { G.catShow = true; G.catTimer = 26; }
    if (S.Audio) S.Audio.setWeather(i, G.fire);
    toast(S.SHICHEN[i] + '　' + (S.SHICHEN_NOTE[i] || ''));
    G.syncScreens();
  };

  G.frameNext = function () {
    if (G.phase !== 'frame') return;
    G.frameIdle = 0;
    if (G.round >= TOTAL_ROUNDS - 1) {
      G.win();
    } else {
      G.startRound(G.round + 1);
    }
  };

  G.win = function () {
    G.phase = 'end';
    G.isWin = true;
    G.dawnT = 0;
    G.endDelay = 1.7;
    G.endShown = false;
    G.catPetT = 0;
    if (S.Audio) { S.Audio.dawn(); }
    G.syncScreens();
  };

  G.lose = function () {
    G.phase = 'end';
    G.isWin = false;
    G.endDelay = 1.5;
    G.endShown = false;
    if (S.Audio) S.Audio.lose();
    G.syncScreens();
  };

  /* ---------------- 动作 ---------------- */
  G.addWood = function () {
    if (!canAct()) return;
    if (G.fetching) { toast('正抱着柴呢'); return; }
    if (G.wood <= 0) {
      toast('柴用完了，去柴堆抱一捆（D）');
      pulse('wood');
      if (S.Audio) S.Audio.fail();
      return;
    }
    G.wood--;
    G.stats.wood++;
    var before = G.fire;
    G.fire = U.clamp(G.fire + 46, 0, 100);
    G.warmth = U.clamp(G.warmth + 1.6, 0, 100);
    setMode('feed', 0.5);
    if (S.Audio) S.Audio.woodAdd();
    floater(L.firebox.x + L.firebox.w / 2, L.firebox.y - 14, '+火', '#ffd08a');
    if (before > 90) toast('火已经很旺，添柴有些可惜');
    bumpWood();
    updateHUD();
  };

  G.fetchWood = function () {
    if (!canAct()) return;
    if (G.fetching) return;
    if (G.wood >= WOOD_MAX) { toast('柴堆已经满啦'); return; }
    G.fetching = true;
    G.fetchP = 0;
    G.fetchPicked = false;
    /* 出门一趟要挨冻 */
    G.warmth = U.clamp(G.warmth - 3.2, 0, 100);
    floater(L.char.x, L.char.y - 150, '出门受冻 −3', '#bcd6f2');
    setMode('walk', FETCH_TIME);
    if (S.Audio) S.Audio.fetch();
  };

  G.toggleDoor = function () {
    if (!canAct()) return;
    if (G.doorAjar) {
      /* 关门 */
      G.doorAjar = false;
      G.stats.closed++;
      G.warmth = U.clamp(G.warmth + 1, 0, 100);
      G.doorVis = Math.max(G.doorVis, 0.85);
      setMode('shovel', 0.25);
      if (S.Audio) S.Audio.fetch();
      floater(L.door.x + L.door.w / 2, L.door.y + 60, '关严了', '#e8d6b4');
      toast('门关严了 · 寒气退了回去');
    } else if (G.knockT > 0) {
      /* 有人叩门：开门讨一口热酒，但要记得再关上 */
      G.knockT = 0;
      G.doorAjar = true;
      G.stats.guests++;
      G.warmth = U.clamp(G.warmth + 9, 0, 100);
      setMode('walk', 0.4);
      if (S.Audio) S.Audio.flipOk(true);
      floater(L.door.x + L.door.w / 2, L.door.y + 30, '热酒 +9 暖', '#ffe0a8', true);
      toast('邻人递来一壶热酒 · 快把门关上');
    } else {
      toast('没人敲门，门关着就好');
    }
    updateHUD();
  };

  G.shovel = function () {
    if (!canAct()) return;
    if (G.shovelCd > 0) return;
    if (G.snow < 1.5) { toast('窗台还干净着呢'); return; }
    G.shovelCd = 0.18;
    G.snow = Math.max(0, G.snow - 9);
    G.stats.shovel++;
    setMode('shovel', 0.3);
    if (S.Audio) S.Audio.shovel();
    floater(L.glass.x + L.glass.w * 0.5, L.glass.y + 40, '扫雪', '#cfe6ff');
    /* 抖落雪屑 */
    G.shakeAmp = Math.max(G.shakeAmp, 1.6);
    updateHUD();
  };

  G.flipCake = function () {
    if (!canAct()) return;
    if (G.cakeCd > 0) return;
    if (G.cakeReady) {
      var perfect = G.cakeT < 3.0;
      if (perfect) {
        G.combo = Math.min(5, G.combo + 1);
        if (G.combo > G.comboBest) G.comboBest = G.combo;
      }
      var gain = 5 + G.combo * 2;
      G.cakeBurnt = false;
      G.cakeReady = false;
      G.cakeCd = 4.2;
      G.cakeT = 0;
      G.stats.cake++;
      if (perfect) G.stats.perfect++;
      G.warmth = U.clamp(G.warmth + gain, 0, 100);
      G.fire = U.clamp(G.fire + (perfect ? 4 : 2), 0, 100);
      setMode('flip', 0.45);
      if (S.Audio) S.Audio.flipOk(perfect);
      floater(L.pan.x, L.pan.y - 46,
        perfect ? '焦香 ×' + G.combo + ' · +' + gain + ' 暖' : '+' + gain + ' 暖',
        perfect ? '#ffe6a8' : '#ffd89a', perfect);
      updateHUD();
      return;
    }
    if (G.cakeBurnt || G.cakeT > 4.6) {
      toast('糊了，重新烙一张');
      G.combo = 0;
      G.cakeT = 0; G.cakeBurnt = false; G.cakeReady = false; G.cakeCd = 1.3;
      if (S.Audio) S.Audio.fail();
      return;
    }
    /* 还生 */
    toast('还生着呢，等它鼓泡');
    G.combo = 0;
    G.cakeT = 0; G.cakeCd = 0.9; G.cakeReady = false;
    if (S.Audio) S.Audio.fail();
  };

  G.petCat = function () {
    if (!canAct() || !G.catShow) return;
    G.catShow = false;
    G.catTimer = 18 + U.rand(0, 8);
    G.catPetT = 1.3;
    G.stats.pets++;
    G.warmth = U.clamp(G.warmth + 5, 0, 100);
    if (S.Audio) S.Audio.meow();
    floater(L.cat.x + L.cat.w / 2, L.cat.y - 6, '咕噜 · +5 暖', '#ffc9a8');
    updateHUD();
  };

  function canAct() {
    return G.phase === 'playing' && !G.paused && !G.knowOpen;
  }

  function setMode(m, dur) {
    G.char.mode = m;
    G.char.t = dur || 0.4;
  }

  /* ---------------- 指针 ---------------- */
  G.pointer = function (x, y) {
    if (G.phase !== 'playing' || G.paused || G.knowOpen) return;
    var h = hit(x, y);
    if (!h) return;
    switch (h.id) {
      case 'stove': G.addWood(); break;
      case 'wood': G.fetchWood(); break;
      case 'window': G.shovel(); break;
      case 'pan': G.flipCake(); break;
      case 'cat': G.petCat(); break;
      case 'door': G.toggleDoor(); break;
    }
  };

  function pulse(id) {
    for (var i = 0; i < HOTS.length; i++) {
      if (HOTS[i].id === id) HOTS[i].show = true;
    }
  }

  /* ---------------- 更新 ---------------- */
  G.update = function (dt) {
    G.t += dt;
    G.dt = dt;

    if (G.phase === 'playing' && !G.paused && !G.knowOpen) updatePlaying(dt);
    else if (G.phase === 'end') updateEnd(dt);
    else if (G.phase === 'pause') updateAmbient(dt, true);
    else if (G.phase === 'title' || G.phase === 'howto') updateAmbient(dt, false);
    else if (G.phase === 'frame') {
      /* 没人点「展卷」时，过一会儿自己往前翻，免得卡住 */
      G.frameIdle += dt;
      if (G.frameIdle > 15 && !G.knowOpen) G.frameNext();
    }

    updateChar(dt);
    updateFloaters(dt);
    updateHints();
    updateToast(dt);
    updateHintBar();

    G.shakeAmp = Math.max(0, G.shakeAmp - dt * 9);
    G.shovelCd = Math.max(0, G.shovelCd - dt);
    G.gustT = Math.max(0, G.gustT - dt / 1.7);
    G.doorVis += ((G.doorAjar ? 1 : 0) - G.doorVis) * Math.min(1, dt * 9);
    G.catPetT = Math.max(0, G.catPetT - dt);

    if (S.Audio) S.Audio.update(dt, { fire: G.fire, music: G.phase !== 'end' });
    updateHUD();
  };

  function updateAmbient(dt, frozen) {
    var t = G.t;
    if (!frozen) {
      G.fire = 30 + Math.sin(t * 0.37) * 7 + Math.sin(t * 1.1) * 2;
      G.snow = 46 + Math.sin(t * 0.12) * 14;
      G.warmth = 66 + Math.sin(t * 0.2) * 6;
    }
    /* 标题界面的糍粑也在悠悠地烙着（暂停时一并冻住） */
    if (!frozen) {
      if (G.cakeCd > 0) { G.cakeCd -= dt; G.cakeReady = false; }
      else {
        G.cakeT += dt;
        if (G.cakeT > 4.6 && !G.cakeBurnt) G.cakeBurnt = true;
        G.cakeReady = G.cakeT >= 2.4 && G.cakeT <= 4.2;
        if (G.cakeT > 6.4) { G.cakeT = 0; G.cakeBurnt = false; G.cakeCd = 1.2; G.cakeReady = false; }
      }
    }
  }

  function updatePlaying(dt) {
    var r = G.round;
    var snowRate = 1.3 + r * 0.62;
    var burnRate = 2.0 + r * 0.30;
    var doorMod = G.doorAjar ? 1.25 : 1;

    G.roundT += dt;
    G.fire = U.clamp(G.fire - burnRate * dt, 0, 100);
    G.snow = U.clamp(G.snow + snowRate * doorMod * dt, 0, 100);

    var cold = 0.44 + r * 0.075 + G.snow * 0.0147;
    if (G.doorAjar) cold *= 1.55;          /* 门敞着，寒气灌进来 */
    var heat = G.fire > 0 ? 0.88 * (G.fire / 100) : 0;
    G.warmth += (heat - cold) * dt;
    if (G.fire <= 0.001) G.warmth -= 1.35 * dt;
    G.warmth = U.clamp(G.warmth, 0, 100);
    if (G.warmth < G.minWarmth) G.minWarmth = G.warmth;

    /* 糍粑 */
    if (G.cakeCd > 0) { G.cakeCd -= dt; G.cakeReady = false; }
    else {
      var spd = G.fire >= 18 ? 1 : 0.34;
      G.cakeT += dt * spd;
      if (!G.cakeBurnt && G.cakeT > 4.65) {
        G.cakeBurnt = true;
        G.cakeReady = false;
        toast('糍粑糊了……');
        if (S.Audio) S.Audio.fail();
      }
      G.cakeReady = !G.cakeBurnt && G.cakeT >= 2.4 && G.cakeT <= 4.2;
      if (G.cakeT > 6.6) { G.cakeT = 0; G.cakeBurnt = false; G.cakeReady = false; G.cakeCd = 1.2; }
    }

    /* 取柴 */
    if (G.fetching) {
      G.fetchP += dt / FETCH_TIME;
      if (!G.fetchPicked && G.fetchP >= 0.5) {
        G.fetchPicked = true;
        G.wood = Math.min(WOOD_MAX, G.wood + WOOD_PER_FETCH);
        bumpWood();
        floater(L.wood.x + L.wood.w / 2, L.wood.y + 20, '+2 柴', '#e8c48c');
        if (S.Audio) S.Audio.fetch();
      }
      if (G.fetchP >= 1) {
        G.fetching = false; G.fetchP = 0; G.fetchPicked = false;
        G.char.mode = 'idle';
      }
    }

    /* 猫 */
    if (G.catTimer > 0) {
      G.catTimer -= dt;
      if (G.catTimer <= 0 && !G.catShow) {
        G.catShow = true;
        toast('猫又溜回来了');
      }
    }

    /* 叩门的人 */
    if (G.knockT > 0) {
      G.knockT -= dt;
      if (G.knockT <= 0) toast('敲门声远了……');
    } else {
      G.knockTimer -= dt;
      if (G.knockTimer <= 0) {
        if (G.doorAjar) G.knockTimer = 4;      /* 门还开着，等关上了再敲 */
        else knock();
      }
    }

    /* 风 */
    G.eventTimer -= dt;
    if (G.eventTimer <= 0) {
      G.eventTimer = 9 + U.rand(0, 6);
      gust();
    }

    if (G.warmth <= 0) { G.warmth = 0; G.lose(); return; }
    if (G.roundT >= G.roundDur) completeRound();
  }

  function gust() {
    G.stats.gusts++;
    G.gustT = 1;
    G.doorAjar = true;
    G.doorVis = 1;
    G.fire = Math.max(0, G.fire - (20 + U.rand(0, 11)));
    G.snow = Math.min(100, G.snow + 12 + U.rand(0, 9));
    G.shakeAmp = 7;
    if (S.Audio) S.Audio.gust();
    toast('风起 · 门被吹开了，快关门（G）');
  }

  function knock() {
    G.knockT = 8;
    G.doorVis = Math.max(G.doorVis, 0.55);
    G.knockTimer = 34 + U.rand(0, 16);
    if (S.Audio) S.Audio.fetch();
    toast('有人叩门 · 点门开门，能讨一口热酒（G）');
  }

  function completeRound() {
    G.roundT = G.roundDur;
    G.fetching = false;
    G.char.mode = 'idle';
    if (S.Audio) S.Audio.chime();
    G.phase = 'frame';
    G.paused = false;
    G.frameIdle = 0;
    showFrame(G.round);
    G.syncScreens();
  }

  function updateEnd(dt) {
    if (G.isWin) {
      G.dawnT = Math.min(1, G.dawnT + dt / 2.6);
      G.fire = Math.max(12, G.fire - dt * 7);
    }
    G.catPetT = Math.max(0, G.catPetT - dt);
    if (G.endDelay > 0) {
      G.endDelay -= dt;
      if (G.endDelay <= 0 && !G.endShown) showEnd();
    }
  }

  function updateChar(dt) {
    var ch = G.char;
    if (ch.t > 0) ch.t -= dt;
    var targetStand = 0, targetArm = 0, targetLean = 0, targetX = L.char.x, targetHold = 0;
    ch.walking = false;

    if (G.fetching) {
      targetStand = 1;
      ch.walking = true;
      targetX = L.char.x + 336 * Math.sin(Math.PI * U.clamp(G.fetchP, 0, 1));
      targetHold = G.fetchP > 0.55 ? 1 : 0;
    } else if (ch.mode === 'feed' && ch.t > 0) {
      var p = 1 - ch.t / 0.5;
      targetArm = Math.sin(Math.PI * U.clamp(p, 0, 1));
      targetStand = 0.25;
    } else if (ch.mode === 'flip' && ch.t > 0) {
      var p2 = 1 - ch.t / 0.45;
      targetLean = Math.sin(Math.PI * U.clamp(p2, 0, 1)) * 0.9;
      targetArm = Math.sin(Math.PI * U.clamp(p2, 0, 1));
    } else if (ch.mode === 'shovel' && ch.t > 0) {
      var p3 = 1 - ch.t / 0.3;
      targetArm = Math.sin(Math.PI * U.clamp(p3, 0, 1));
      targetLean = -Math.sin(Math.PI * U.clamp(p3, 0, 1)) * 0.35;
    } else if (ch.mode === 'walk' && ch.t > 0) {
      targetStand = 0.2;
    }
    if (G.gustT > 0.35) targetLean = Math.max(targetLean, 0.12);

    var k = 1 - Math.pow(0.0015, dt);
    ch.stand = U.lerp(ch.stand, targetStand, k);
    ch.arm = U.lerp(ch.arm, targetArm, k);
    ch.lean = U.lerp(ch.lean, targetLean, k);
    ch.hold = U.lerp(ch.hold, targetHold, k);
    ch.x = U.lerp(ch.x, targetX, k);
  }

  function updateFloaters(dt) {
    for (var i = G.floaters.length - 1; i >= 0; i--) {
      var f = G.floaters[i];
      f.life -= dt;
      if (f.life <= 0) G.floaters.splice(i, 1);
    }
  }

  function floater(x, y, text, color, big) {
    G.floaters.push({ x: x, y: y, text: text, color: color, life: 1.25, max: 1.25, big: !!big });
  }

  /* ---------------- 提示 ---------------- */
  function updateHints() {
    var playing = G.phase === 'playing' && !G.paused && !G.knowOpen;
    var byId = {};
    for (var i = 0; i < HOTS.length; i++) byId[HOTS[i].id] = HOTS[i];

    byId.pan.show = playing && G.cakeReady;
    byId.stove.show = playing && (G.fire < 42 || (G.round === 0 && G.roundT < 9));
    byId.window.show = playing && (G.snow > 52 || (G.round === 0 && G.roundT > 20 && G.roundT < 32));
    byId.wood.show = playing && (G.wood <= 1);
    byId.cat.show = false;
    byId.door.show = playing && (G.doorAjar || G.knockT > 0);

    byId.cat.active = !!G.catShow;
    byId.door.active = true;
    byId.pan.active = !(G.cakeCd > 0.55);
  }

  var lastHint = null;
  function updateHintBar() {
    var el = G.el['hint-text'];
    if (!el) return;
    var s = '';
    if (G.phase === 'playing') {
      if (G.doorAjar) s = '门被吹开了 · 快关门（G）';
      else if (G.knockT > 0) s = '有人叩门 · 点门开门讨口热酒（G）';
      else if (G.wood <= 0) s = '柴用完了 · 去柴堆抱一捆（D）';
      else if (G.fire < 22) s = '炉火要灭了 · 快添柴（A）';
      else if (G.snow > 66) s = '窗快被雪埋住了 · 扫一扫（S）';
      else if (G.cakeReady) s = '糍粑正好 · 点锅翻面（F）';
      else if (G.wood <= 1) s = '柴不多了 · 趁早去取（D）';
      else s = 'A 添柴　S 扫雪　D 取柴　F 翻糍粑　G 开关门　Esc 暂停';
    }
    if (s !== lastHint) {
      lastHint = s;
      el.textContent = s;
    }
  }

  /* ---------------- 拖尾提示 ---------------- */
  var toastTimer = 0;
  function toast(msg) {
    var el = G.el.toast;
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    toastTimer = 2.3;
  }
  function hideToast() {
    if (G.el.toast) G.el.toast.classList.remove('show');
    toastTimer = 0;
  }
  function updateToast(dt) {
    if (toastTimer > 0) {
      toastTimer -= dt;
      if (toastTimer <= 0) hideToast();
    }
  }

  function bumpWood() {
    var el = G.el['wood-chip'];
    if (!el) return;
    el.classList.add('bump');
    setTimeout(function () { el.classList.remove('bump'); }, 200);
  }

  /* ---------------- HUD ---------------- */
  var hudCache = { w: -1, f: -1, s: -1, wood: -1, sh: '', dots: -1, end: false, low: null, muted: null };
  function updateHUD() {
    var el = G.el;
    if (!el) return;
    var w = Math.round(G.warmth), f = Math.round(G.fire), s = Math.round(G.snow);
    if (hudCache.w !== w) {
      hudCache.w = w;
      if (el['f-warmth']) el['f-warmth'].style.width = w + '%';
      if (el['v-warmth']) el['v-warmth'].textContent = w;
    }
    if (hudCache.f !== f) {
      hudCache.f = f;
      if (el['f-fire']) el['f-fire'].style.width = f + '%';
      if (el['v-fire']) el['v-fire'].textContent = f;
    }
    if (hudCache.s !== s) {
      hudCache.s = s;
      if (el['f-snow']) el['f-snow'].style.width = s + '%';
      if (el['v-snow']) el['v-snow'].textContent = s;
    }
    if (hudCache.wood !== G.wood) {
      hudCache.wood = G.wood;
      if (el['v-wood']) el['v-wood'].textContent = G.wood;
    }
    var low = G.warmth < 30;
    if (hudCache.low !== low) {
      hudCache.low = low;
      if (el['g-warmth']) el['g-warmth'].classList.toggle('low', low);
    }

    var isEnd = G.phase === 'end';
    var shText = (isEnd ? '卯时' : (S.SHICHEN[G.round] || '戌时')) +
      '<small>' + (isEnd ? '天将明' : (S.SHICHEN_NOTE[G.round] || '')) + '</small>';
    if (hudCache.sh !== shText) {
      hudCache.sh = shText;
      if (el.shichen) el.shichen.innerHTML = shText;
    }
    if (el.rounds && (hudCache.dots !== G.round || hudCache.end !== isEnd)) {
      hudCache.dots = G.round;
      hudCache.end = isEnd;
      var dots = el.rounds.children;
      for (var i = 0; i < dots.length; i++) {
        var cls = i < G.round ? 'on' : (i === G.round ? 'cur' : '');
        if (isEnd && G.isWin) cls = 'on';
        if (dots[i].className !== cls) dots[i].className = cls;
      }
    }
    var muted = !!(S.Audio && S.Audio.muted);
    if (hudCache.muted !== muted) {
      hudCache.muted = muted;
      if (el['btn-sound']) el['btn-sound'].classList.toggle('off', muted);
    }
  }

  /* ---------------- 卡片 / 结算 ---------------- */
  function frames() {
    return COPY.frames || [];
  }

  function showFrame(i) {
    var f = frames()[i] || {};
    var el = G.el;
    txt('fr-badge', f.label || ('第 ' + (i + 1) + ' 候'));
    txt('fr-name', f.name || '');
    txt('fr-mark', (f.name || '雪').charAt(0));
    if (el['fr-lines']) {
      el['fr-lines'].innerHTML = '';
      (f.lines || []).forEach(function (line) {
        var p = document.createElement('p');
        p.textContent = line;
        el['fr-lines'].appendChild(p);
      });
    }
    txt('fr-quote', f.quote ? '「' + f.quote + '」' : '');
    txt('fr-src', f.quoteFrom || '');
    txt('fr-count', '第 ' + (i + 1) + ' 帧 · 共 ' + TOTAL_ROUNDS + ' 帧');
    if (i === TOTAL_ROUNDS - 1) txt('btn-frame-next', '天将明');
    else txt('btn-frame-next', '展卷');
  }

  function showEnd() {
    G.endShown = true;
    var el = G.el;
    var won = G.isWin;
    var card = el['scr-end'] ? el['scr-end'].querySelector('.end-card') : null;
    if (card) card.classList.toggle('lose', !won);

    var data = won ? (COPY.endWin || {}) : (COPY.endLose || {});
    txt('e-title', data.title || (won ? '天亮了' : '炉火熄了'));
    if (el['e-lines']) {
      el['e-lines'].innerHTML = '';
      (data.lines || []).forEach(function (line) {
        var p = document.createElement('p');
        p.textContent = line;
        el['e-lines'].appendChild(p);
      });
    }

    /* 卷轴：五帧 */
    if (el['e-scroll']) {
      el['e-scroll'].innerHTML = '';
      frames().forEach(function (f) {
        var d = document.createElement('div');
        d.className = 'sframe';
        d.innerHTML = '<i>' + esc(f.label || '') + '</i><b>' + esc(f.name || '') + '</b>';
        el['e-scroll'].appendChild(d);
      });
      el['e-scroll'].style.display = won ? 'flex' : 'none';
    }

    /* 引文 */
    if (el['e-quote']) {
      if (won && data.quote) {
        el['e-quote'].innerHTML = '「' + esc(data.quote) + '」<em>' + esc(data.quoteFrom || '') + '</em>';
        el['e-quote'].style.display = '';
      } else {
        el['e-quote'].style.display = 'none';
      }
    }

    /* 数据 */
    if (el['e-stats']) {
      var items = won ? [
        ['余温', Math.round(G.warmth)],
        ['最险', Math.round(G.minWarmth)],
        ['焦香连击', G.comboBest + ' 连'],
        ['添柴', G.stats.wood + ' 把']
      ] : [
        ['撑到', (G.round + 1) + ' / ' + TOTAL_ROUNDS + ' 更'],
        ['添柴', G.stats.wood + ' 把'],
        ['糍粑', G.stats.cake + ' 张'],
        ['撸猫', G.stats.pets + ' 次']
      ];
      el['e-stats'].innerHTML = '';
      items.forEach(function (it) {
        var d = document.createElement('div');
        d.innerHTML = '<i>' + esc(it[0]) + '</i><b>' + esc(it[1]) + '</b>';
        el['e-stats'].appendChild(d);
      });
    }

    /* 评级 */
    if (el['e-rating']) {
      var rank = rankOf(won);
      el['e-rank'].textContent = rank.rank;
      el['e-rankname'].textContent = rank.name;
      el['e-rating'].style.opacity = won ? '1' : '0';
    }

    /* 按钮 */
    if (el['e-btns']) {
      el['e-btns'].innerHTML = '';
      var b1 = mkBtn(won ? '再守一夜' : '重燃一炉', 'primary', function () {
        if (S.Audio) S.Audio.uiClick();
        G.startGame();
      });
      var b2 = mkBtn(COPY.knowledgeTitle || '小雪小识', '', function () {
        if (S.Audio) S.Audio.uiClick();
        G.openKnow();
      });
      var b3 = mkBtn('回到首页', 'ghost', function () {
        if (S.Audio) S.Audio.uiClick();
        G.toTitle();
      });
      el['e-btns'].appendChild(b1);
      el['e-btns'].appendChild(b2);
      el['e-btns'].appendChild(b3);
    }
    if (S.Audio) S.Audio.up();
  }

  function mkBtn(label, cls, fn) {
    var b = document.createElement('button');
    b.className = 'btn ' + (cls || '');
    b.textContent = label;
    b.addEventListener('click', fn);
    return b;
  }

  function rankOf(won) {
    var list = COPY.rating || [{ rank: 'S', name: '' }];
    if (!won) return { rank: '—', name: '尚可再来' };
    /* 不只看最后一刻：一路上的最低温暖也计入，濒死通关拿不到 S */
    var score = G.warmth * 0.62 + G.minWarmth * 0.38;
    var idx = 3;
    if (score >= 84) idx = 0;
    else if (score >= 66) idx = 1;
    else if (score >= 46) idx = 2;
    return list[idx] || list[list.length - 1];
  }

  /* 供外部调试 */
  G.showFrame = showFrame;
  G.showEnd = showEnd;
})();

/* ===================== boot.js ===================== */
/* =========================================================
 * 雪落围炉 · boot.js —— 画布适配 / 主循环 / 调试场景
 * ======================================================= */
(function () {
  'use strict';
  var S = window.Snow;
  var stage, cv, ctx;
  var last = 0;
  var started = false;

  function fit() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var scale = Math.min(vw / 1280, vh / 720);
    if (!isFinite(scale) || scale <= 0) scale = 1;
    var w = Math.round(1280 * scale);
    var h = Math.round(720 * scale);
    stage.style.width = w + 'px';
    stage.style.height = h + 'px';
    stage.style.setProperty('--u', (w / 1280) + 'px');
    stage.style.setProperty('--v', (h / 720) + 'px');
    /* 画布缓冲按"显示尺寸 × 像素比"分配，放大窗口也不发虚 */
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var k = (w / 1280) * dpr;
    var bw = Math.round(1280 * k), bh = Math.round(720 * k);
    if (cv.width !== bw || cv.height !== bh) {
      cv.width = bw;
      cv.height = bh;
    }
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.imageSmoothingEnabled = true;
  }

  function frame(now) {
    if (!last) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt > 0.06) dt = 0.06;      /* 切标签页回来不要跳帧 */
    if (dt < 0) dt = 0;
    /* 主循环兜底：单帧异常不掐断循环，否则画面会永久冻结 */
    try {
      S.Game.update(dt);
      S.Scene.update(S.Game, dt);
      S.Scene.draw(S.Game);
    } catch (e) {
      if (window.console) console.warn('[frame] 一帧出错，已跳过：', e);
      S.Game._frameErrors = (S.Game._frameErrors || 0) + 1;
    }
    requestAnimationFrame(frame);
  }

  function boot() {
    if (started) return;
    started = true;
    stage = document.getElementById('stage');
    cv = document.getElementById('cv');
    if (!stage || !cv || !cv.getContext) {
      return;
    }
    ctx = cv.getContext('2d');
    if (!ctx) return;

    /* 调试/截图场景：?scene=title|howto|play|frame|end|lose&t=秒&n=帧 */
    var q = {};
    try {
      location.search.replace(/[?&]([^=&]+)=?([^&]*)/g, function (_, k, v) {
        q[decodeURIComponent(k)] = decodeURIComponent(v || '');
        return '';
      });
    } catch (e) { q = {}; }

    /* 截图模式：关掉过渡与动画，避免无头浏览器把过渡停在半途 */
    if (q.shot || q.nofx) {
      var st = document.createElement('style');
      st.textContent = '*,*::before,*::after{transition:none!important;animation:none!important}';
      document.head.appendChild(st);
    }
    /* 调试错误面板 */
    if (q.debug) {
      window.addEventListener('error', function (ev) {
        var pre = document.getElementById('errbox');
        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'errbox';
          pre.style.cssText = 'position:fixed;left:0;top:0;z-index:9999;max-width:100%;' +
            'max-height:100%;overflow:auto;margin:0;padding:8px;background:#300;color:#fdd;' +
            'font:12px monospace;white-space:pre-wrap';
          document.body.appendChild(pre);
        }
        pre.textContent += (ev.message || 'error') + ' @ ' + (ev.filename || '') + ':' + (ev.lineno || '') + '\n';
      });
    }

    fit();
    window.addEventListener('resize', fit);
    window.addEventListener('orientationchange', function () {
      setTimeout(fit, 120);
    });

    S.Art.build();
    S.Scene.init(ctx);
    S.Game.init();

    var sc = q.scene || '';
    var G = S.Game;
    var auto = !!q.auto;

    /* 简易托管（仅调试用）：截图和冒烟测试时让画面处于"有人守着"的状态 */
    function botDecide(game) {
      if (game.phase !== 'playing' || game.paused) return;
      if (game.doorAjar) { game.toggleDoor(); return; }
      if (game.knockT > 0) { game.toggleDoor(); return; }
      if (game.fire < 46 && game.wood > 0) game.addWood();
      else if (game.wood < 3 && !game.fetching) game.fetchWood();
      if (game.snow > 44) { game.shovel(); game.shovel(); game.shovel(); }
      if (game.cakeReady) game.flipCake();
      if (game.catShow) game.petCat();
    }
    var botDelay = Math.max(0, parseFloat(q.react || '0'));
    var botErr = Math.max(0, Math.min(1, parseFloat(q.err || '0')));
    var botClock = 0;
    function botStep(game, dt) {
      if (game.phase !== 'playing' || game.paused) return;
      if (botDelay > 0) {
        botClock += dt;
        if (botClock < botDelay) return;
        botClock = 0;
      }
      if (botErr > 0 && Math.random() < botErr) {
        /* 手一滑：点到别处 */
        game.pointer(460 + Math.random() * 380, 470 + Math.random() * 160);
        return;
      }
      botDecide(game);
    }
    function sim(seconds) {
      var n = Math.min(36000, Math.round(seconds * 60));
      for (var i = 0; i < n; i++) {
        if (auto) {
          if (G.phase === 'frame') G.frameNext();
          botStep(G, 1 / 60);
        }
        G.update(1 / 60);
        S.Scene.update(G, 1 / 60);
        if (!auto && G.phase !== 'playing') break;
        if (auto && G.phase === 'end' && G.endShown) break;
      }
      if (window.console && auto) {
        console.log('[sim] phase=' + G.phase + ' win=' + G.isWin +
          ' round=' + G.round + ' warmth=' + Math.round(G.warmth) +
          ' fire=' + Math.round(G.fire) + ' snow=' + Math.round(G.snow) +
          ' wood=' + G.wood + ' t=' + G.t.toFixed(1) +
          ' stats=' + JSON.stringify(G.stats));
      }
    }
    try {
      if (sc === 'howto') {
        G.phase = 'howto';
        G.syncScreens();
      } else if (sc === 'bench') {        /* 难度基准：不同反应速度/失误率下的胜率 */
        var combos = [[0, 0], [0.6, 0.03], [1.2, 0.1], [1.8, 0.2], [2.6, 0.35], [3.5, 0.5]];
        var lines = [];
        for (var ci = 0; ci < combos.length; ci++) {
          var react = combos[ci][0], err = combos[ci][1];
          var wins = 0, warmSum = 0, roundSum = 0, N = 6;
          for (var k = 0; k < N; k++) {
            G.startGame();
            var bc = 0;
            for (var f = 0; f < 60 * 400; f++) {
              if (G.phase === 'frame') G.frameNext();
              if (G.phase !== 'playing') break;
              bc += 1 / 60;
              if (bc >= react) {
                bc = 0;
                if (err > 0 && Math.random() < err) {
                  G.pointer(460 + Math.random() * 380, 470 + Math.random() * 160);
                } else {
                  botDecide(G);
                }
              }
              G.update(1 / 60);
              S.Scene.update(G, 1 / 60);
              if (G.phase === 'end') break;
            }
            if (G.isWin) { wins++; warmSum += G.warmth; }
            else { roundSum += G.round + 1; }
          }
          lines.push('[bench] react=' + react + 's err=' + Math.round(err * 100) +
            '%  win=' + wins + '/' + N +
            '  avgWarm=' + (wins ? (warmSum / wins).toFixed(0) : '-') +
            '  avgLoseRound=' + (wins < N ? (roundSum / (N - wins)).toFixed(1) : '-'));
        }
        if (window.console) console.log(lines.join('\n'));
      } else if (sc === 'play' || sc === 'frame' || sc === 'end' || sc === 'lose') {
        G.startGame();
        if (sc === 'play') {
          sim(parseFloat(q.t || '0'));
        } else if (sc === 'frame') {
          sim(parseFloat(q.t || '9'));
          G.round = parseInt(q.n || '0', 10) || 0;
          G.phase = 'frame';
          G.showFrame(G.round);
          G.syncScreens();
        } else if (sc === 'end') {
          sim(parseFloat(q.t || '5'));
          G.round = 4;
          G.warmth = 74;
          G.stats = { wood: 11, cake: 6, perfect: 4, shovel: 15, pets: 2, gusts: 3 };
          G.minWarmth = 58;
          G.phase = 'end'; G.isWin = true; G.dawnT = 1;
          G.showEnd();
          G.syncScreens();
        } else if (sc === 'lose') {
          G.phase = 'end'; G.isWin = false; G.warmth = 0;
          G.showEnd();
          G.syncScreens();
        }
      }
    } catch (e) {
      if (window.console) console.warn('debug scene error', e);
    }
    if (q.know) {
      try { G.openKnow(); } catch (e2) {}
    }
    if (q.door) { G.doorAjar = true; G.doorVis = 1; G.knockT = q.knock ? 8 : 0; }
    if (q.combo) { G.combo = parseInt(q.combo, 10) || 0; }

    S.Scene.draw(S.Game);
    last = 0;
    started = true;
    requestAnimationFrame(frame);

    /* 首次任意交互，启动音频（浏览器自动播放策略） */
    var kick = function () {
      if (S.Audio && !S.Audio.ready) {
        S.Audio.init();
        S.Audio.start();
      }
      document.removeEventListener('pointerdown', kick);
      document.removeEventListener('keydown', kick);
    };
    document.addEventListener('pointerdown', kick);
    document.addEventListener('keydown', kick);

    document.title = (S.COPY && S.COPY.title ? S.COPY.title + ' · ' : '') +
      (S.COPY && S.COPY.subtitle ? S.COPY.subtitle : '小雪三候 一夜守炉');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>

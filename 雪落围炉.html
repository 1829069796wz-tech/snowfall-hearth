<style>/* =========================================================================

:root {
  --u: 1px;
  --font-sans: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", sans-serif;

  --ink: #14100e;

  --gold: #c8a15c;
  --gold-dim: rgba(200, 161, 92, 0.45);
  --seal: #a8332a;
  --text: #f2e8d5;
  --text-dim: #cbbda4;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: #06080d;
}

  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-sans);
  color: var(--text);
  user-select: none; -webkit-user-select: none;
  touch-action: manipulation;
}

#stage {
  position: relative;
  width: 1280px; height: 720px;
  overflow: hidden;
  background: #0a0e18;
  box-shadow: 0 0 120px rgba(0, 0, 0, 0.9);
}
#cv { display: block; width: 100%; height: 100%; }

/* ============================ HUD ============================ */
#hud {
  position: absolute; left: 0; top: 0; right: 0;
  display: flex; align-items: flex-start; justify-content: space-between;
  padding: calc(20 * var(--u));
  pointer-events: none;
  opacity: 0; transition: opacity 0.6s ease;
}
#hud.show { opacity: 1; }
.hud-left { display: flex; flex-direction: column; gap: calc(9 * var(--u)); }

.g-head {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: calc(12.5 * var(--u)); letter-spacing: 0.16em;
  color: rgba(242, 232, 213, 0.82);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.85);
  margin-bottom: calc(3 * var(--u));
}
.g-val { font-family: var(--font-serif); font-size: calc(14 * var(--u)); opacity: 0.9; }
.g-track {
  height: calc(7 * var(--u));
  background: rgba(0, 0, 0, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: calc(6 * var(--u));
  overflow: hidden;
}
.g-fill {
  display: block; height: 100%; width: 50%;
  border-radius: calc(6 * var(--u));
  transition: width 0.16s linear;
}
#f-warmth { background: linear-gradient(90deg, #b8452a, #ef8447, #ffc27e); }
#f-fire { background: linear-gradient(90deg, #a15c12, #eda036, #ffe291); }
#f-snow { background: linear-gradient(90deg, #47769f, #8dbfec, #e2f2ff); }
#g-warmth.low .g-fill { animation: pulseCold 0.95s infinite; }
#g-warmth.low .g-head { color: #ffb9a4; }
@keyframes pulseCold {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.85); }
}

.hud-right {
  display: flex; align-items: center; gap: calc(15 * var(--u));
  pointer-events: auto;
}
.wood-chip {
  display: flex; align-items: center; gap: calc(7 * var(--u));
  background: rgba(8, 10, 16, 0.5);
  border: 1px solid rgba(200, 161, 92, 0.3);
  padding: calc(6 * var(--u)) calc(12 * var(--u));
  border-radius: calc(4 * var(--u));
  font-size: calc(14 * var(--u));

}
.wood-chip.bump { transform: scale(1.12); border-color: var(--gold); }

.rounds { display: flex; gap: calc(5 * var(--u)); justify-content: flex-end; margin-top: calc(6 * var(--u)); }
.rounds i {

}

.hud-ctrls { display: flex; gap: calc(8 * var(--u)); }

/* ======================== toast / hint ======================== */

}
.screen.dark { background: rgba(5, 7, 12, 0.6); backdrop-filter: blur(3px); }

/* =========================== buttons =========================== */
.btn {

  border: 1px solid var(--gold-dim);
  background: linear-gradient(180deg, rgba(244, 233, 212, 0.1), rgba(244, 233, 212, 0.025));

.row { display: flex; gap: calc(16 * var(--u)); justify-content: center; align-items: center; flex-wrap: wrap; }

/* =========================== TITLE =========================== */

.paper {

/* --------------------------- howto --------------------------- */

(function () {

  var S = (window.Snow = window.Snow || {});

  var U = {};
  S.U = U;

  U.clamp = function (v, a, b) { return v < a ? a : v > b ? b : v; };
  U.lerp = function (a, b, t) { return a + (b - a) * t; };
  U.invLerp = function (a, b, v) { return U.clamp((v - a) / (b - a || 1e-6), 0, 1); };
  U.easeOut = function (t) { t = U.clamp(t, 0, 1); return 1 - Math.pow(1 - t, 3); };
  U.easeInOut = function (t) {
    t = U.clamp(t, 0, 1);
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  };
  U.easeOutBack = function (t) {
    t = U.clamp(t, 0, 1);
    var c = 1.70158;
    return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2);
  };
  U.rand = function (a, b) {
    if (a === undefined) return Math.random();
    if (b === undefined) return Math.random() * a;
    return a + Math.random() * (b - a);
  };
  U.randInt = function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); };
  U.pick = function (arr) { return arr[(Math.random() * arr.length) | 0]; };
  U.chance = function (p) { return Math.random() < p; };
  U.sign = function (v) { return v < 0 ? -1 : 1; };

  /* 便宜的确定性噪声，用于火苗、雪花摇摆 */
  U.noise = function (x) {
    return (
      Math.sin(x * 1.7) * 0.5 +
      Math.sin(x * 2.93 + 1.31) * 0.3 +
      Math.sin(x * 5.31 + 2.73) * 0.2
    );
  };
  U.noise2 = function (x, y) {
    return (
      Math.sin(x * 1.31 + y * 0.71) * 0.5 +
      Math.sin(x * 2.71 - y * 1.93 + 1.1) * 0.3 +
      Math.sin(x * 4.97 + y * 3.17 + 2.2) * 0.2

  /* 颜色：'#rrggbb' + alpha -> rgba() */
  U.rgba = function (hex, a) {
    if (hex.charAt(0) !== '#') return hex;
    var h = hex.length === 4
      ? '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3]
      : hex;
    var n = parseInt(h.slice(1), 16);
    return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
  };

  /* 圆角矩形路径 */
  U.roundRect = function (ctx, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  };

  U.ellipse = function (ctx, x, y, rx, ry, rot) {
    ctx.beginPath();
    if (ctx.ellipse) ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, Math.PI * 2);
    else ctx.arc(x, y, Math.abs(rx), 0, Math.PI * 2);
  };

  U.inRect = function (px, py, r) {
    return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;

  /* 本地存储（隐私模式或 file:// 限制时静默失败） */

      try { window.localStorage.setItem('xueluo_' + k, JSON.stringify(v)); } catch (e) {}

    ridge(h * 0.66, 18, '#1e2c46', 2.7, false);
    ridge(h * 0.78, 14, '#16223a', 4.4, false);

    /* 远山雪脊高光 */
    c.save();
    c.globalAlpha = 0.5;
    c.strokeStyle = 'rgba(214,231,255,0.7)';
    c.lineWidth = 1.4;
    c.beginPath();
    for (var x2 = 0; x2 <= w; x2 += 5) {
      var y2 = h * 0.56 + Math.sin(x2 * 0.013 + 1.2) * 15
        + Math.sin(x2 * 0.037 + 2.76) * 6.8 + Math.sin(x2 * 0.0071 + 0.84) * 12;
      if (x2 === 0) c.moveTo(x2, y2); else c.lineTo(x2, y2);
    }
    c.stroke();
    c.restore();

    /* 松林剪影 + 雪 */
    function pine(x, baseY, hgt, dark) {
      var wd = hgt * 0.46;
      c.fillStyle = dark;
      for (var t = 0; t < 4; t++) {
        var ty = baseY - hgt * (0.12 + t * 0.23);
        var tw = wd * (1 - t * 0.17);
        c.beginPath();
        c.moveTo(x, ty - hgt * 0.30);
        c.lineTo(x - tw, ty);
        c.lineTo(x + tw, ty);
        c.closePath();
        c.fill();
      }
      c.fillRect(x - hgt * 0.022, baseY - hgt * 0.2, hgt * 0.044, hgt * 0.2);
      /* 雪压枝头 */
      c.fillStyle = 'rgba(226,238,255,0.58)';
      for (var s2 = 0; s2 < 4; s2++) {
        var sy2 = baseY - hgt * (0.14 + s2 * 0.23);
        var sw = wd * (1 - s2 * 0.17) * 0.62;
        c.beginPath();
        c.moveTo(x - sw, sy2 - 1.5);
        c.lineTo(x + sw, sy2 - 1.5);
        c.lineTo(x + sw * 0.5, sy2 - 3.6);
        c.lineTo(x - sw * 0.4, sy2 - 3.2);
        c.closePath(); c.fill();
      }
    }
    var trees = [
      [0.05, 0.9, 92, '#0d1526'], [0.14, 0.98, 66, '#0b1222'], [0.24, 0.88, 108, '#0d1526'],
      [0.35, 1.0, 74, '#0a1020'], [0.47, 0.92, 58, '#0c1424'], [0.62, 0.99, 86, '#0b1222'],
      [0.78, 0.9, 70, '#0d1526'], [0.9, 0.97, 96, '#0a1020'], [0.99, 0.88, 62, '#0c1424']
    ];
    for (var ti = 0; ti < trees.length; ti++) {
      pine(trees[ti][0] * w, trees[ti][1] * h, trees[ti][2], trees[ti][3]);
    }

    /* 雪地 */
    var ground = c.createLinearGradient(0, h * 0.9, 0, h);
    ground.addColorStop(0, '#39496a');
    ground.addColorStop(1, '#22304b');
    c.fillStyle = ground;
    c.beginPath();
    c.moveTo(0, h);
    c.lineTo(0, h * 0.93);
    for (var gx = 0; gx <= w; gx += 10) {
      c.lineTo(gx, h * 0.93 + Math.sin(gx * 0.02 + 1) * 3);
    }
    c.lineTo(w, h); c.closePath(); c.fill();

    /* 远处人家的灯火 */
    var lx = w * 0.135, ly = h * 0.83;
    var lg = c.createRadialGradient(lx, ly, 0, lx, ly, 26);
    lg.addColorStop(0, 'rgba(255,196,110,0.75)');
    lg.addColorStop(0.25, 'rgba(255,168,80,0.28)');
    lg.addColorStop(1, 'rgba(255,168,80,0)');
    c.fillStyle = lg;
    c.fillRect(lx - 28, ly - 28, 56, 56);
    c.fillStyle = 'rgba(255,214,150,0.95)';
    c.fillRect(lx - 2.5, ly - 2.5, 5, 4.5);
    var lx2 = w * 0.44, ly2 = h * 0.87;
    var lg2 = c.createRadialGradient(lx2, ly2, 0, lx2, ly2, 16);
    lg2.addColorStop(0, 'rgba(255,190,110,0.55)');
    lg2.addColorStop(1, 'rgba(255,180,90,0)');
    c.fillStyle = lg2;
    c.fillRect(lx2 - 18, ly2 - 18, 36, 36);
    c.fillStyle = 'rgba(255,214,150,0.9)';
    c.fillRect(lx2 - 1.8, ly2 - 1.8, 3.6, 3.2);

    /* 雪雾（越靠下越白） */
    var mist = c.createLinearGradient(0, h * 0.55, 0, h);
    mist.addColorStop(0, 'rgba(196,214,240,0)');
    mist.addColorStop(0.7, 'rgba(190,210,238,0.10)');
    mist.addColorStop(1, 'rgba(200,220,248,0.20)');
    c.fillStyle = mist;
    c.fillRect(0, h * 0.55, w, h * 0.45);

    return lay;
  }

  /* =========================================================
   * 屋内：墙、梁、地板、门窗框、家具、挂物
   * ======================================================= */
  function wallPlanks(c) {
    var top = L.WALL_TOP, bot = L.FLOOR_Y;
    var band = 54;
    for (var y = top; y < bot; y += band) {
      var hh = Math.min(band, bot - y);
      var k = (y / band) | 0;
      var t1 = 0.3 + rnd(k * 3.3) * 0.7;
      var g = c.createLinearGradient(0, y, 0, y + hh);
      g.addColorStop(0, 'rgba(' + ((84 + 24 * t1) | 0) + ',' + ((60 + 18 * t1) | 0) + ',' + ((43 + 13 * t1) | 0) + ',1)');
      g.addColorStop(0.5, 'rgba(' + ((71 + 21 * t1) | 0) + ',' + ((50 + 16 * t1) | 0) + ',' + ((36 + 11 * t1) | 0) + ',1)');
      g.addColorStop(1, 'rgba(' + ((57 + 18 * t1) | 0) + ',' + ((40 + 13 * t1) | 0) + ',' + ((28 + 9 * t1) | 0) + ',1)');
      c.fillStyle = g;
      c.fillRect(0, y, 1280, hh);
      /* 板缝 */
      c.fillStyle = 'rgba(18,11,7,0.62)';
      c.fillRect(0, y + hh - 2, 1280, 2);
      c.fillStyle = 'rgba(255,214,160,0.07)';
      c.fillRect(0, y, 1280, 1);
      /* 木纹 */
      for (var s = 0; s < 7; s++) {
        var gy = y + 4 + rnd(k * 9.1 + s) * (hh - 10);
        c.strokeStyle = 'rgba(20,12,8,' + (0.06 + rnd(k + s * 2.2) * 0.08) + ')';
        c.lineWidth = 1;
        c.beginPath();
        c.moveTo(0, gy);
        for (var gx = 0; gx <= 1280; gx += 40) {
          c.lineTo(gx, gy + Math.sin(gx * 0.013 + s) * 1.8);
        }
        c.stroke();
      }
      /* 竖向拼缝 */
      var seams = 2 + ((rnd(k * 5.7) * 2) | 0);
      for (var q = 0; q < seams; q++) {
        var sx = rnd(k * 13.1 + q * 7.7) * 1280;
        c.fillStyle = 'rgba(16,10,6,0.4)';
        c.fillRect(sx, y, 1.5, hh);
      }
    }
  }

  /* 墙面的细节：竖直木纹、木节、烟熏、墙影 */
  function wallDetail(c) {
    var i;
    for (i = 0; i < 54; i++) {
      var x = rnd(i * 7.1) * 1280;
      var y0 = L.WALL_TOP + rnd(i * 3.7) * (L.FLOOR_Y - L.WALL_TOP - 60);
      var h = 40 + rnd(i * 5.3) * 130;
      c.strokeStyle = 'rgba(24,14,9,' + (0.05 + rnd(i * 2.1) * 0.09) + ')';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(x, y0);
      c.bezierCurveTo(x + 4, y0 + h * 0.3, x - 5, y0 + h * 0.7, x + 2, y0 + h);
      c.stroke();
    }
    for (i = 0; i < 16; i++) {
      var kx = rnd(i * 11.7) * 1280;
      var ky = L.WALL_TOP + 30 + rnd(i * 4.3) * (L.FLOOR_Y - L.WALL_TOP - 90);
      var kr = 2 + rnd(i * 6.1) * 5;
      c.fillStyle = 'rgba(20,12,7,0.34)';
      c.beginPath(); c.ellipse(kx, ky, kr, kr * 0.68, rnd(i) * 3, 0, 6.2832); c.fill();
      c.strokeStyle = 'rgba(20,12,7,0.16)';
      c.lineWidth = 1;
      c.beginPath(); c.ellipse(kx, ky, kr * 2.3, kr * 1.55, 0, 0, 6.2832); c.stroke();
    }
    /* 灶上方被烟熏过的一片 */
    var soot = c.createRadialGradient(556, 372, 20, 556, 372, 340);
    soot.addColorStop(0, 'rgba(14,9,6,0.32)');
    soot.addColorStop(0.55, 'rgba(14,9,6,0.13)');
    soot.addColorStop(1, 'rgba(14,9,6,0)');
    c.fillStyle = soot;
    c.fillRect(180, 120, 780, 430);

    /* 两侧墙角压暗 */
    var lg = c.createLinearGradient(0, 0, 150, 0);
    lg.addColorStop(0, 'rgba(8,5,3,0.55)');
    lg.addColorStop(1, 'rgba(8,5,3,0)');
    c.fillStyle = lg;
    c.fillRect(0, L.WALL_TOP, 150, L.FLOOR_Y - L.WALL_TOP);
    var rg2 = c.createLinearGradient(1280, 0, 1120, 0);
    rg2.addColorStop(0, 'rgba(8,5,3,0.5)');
    rg2.addColorStop(1, 'rgba(8,5,3,0)');
    c.fillStyle = rg2;
    c.fillRect(1120, L.WALL_TOP, 160, L.FLOOR_Y - L.WALL_TOP);

    /* 梁下的阴影 */
    var tg = c.createLinearGradient(0, L.WALL_TOP, 0, L.WALL_TOP + 130);
    tg.addColorStop(0, 'rgba(8,5,3,0.62)');
    tg.addColorStop(1, 'rgba(8,5,3,0)');
    c.fillStyle = tg;
    c.fillRect(0, L.WALL_TOP, 1280, 130);

    /* 地上暖色反光（静态基底，逐帧还会叠加火光） */
    var fg = c.createRadialGradient(556, 700, 20, 556, 700, 380);
    fg.addColorStop(0, 'rgba(160,80,36,0.20)');
    fg.addColorStop(1, 'rgba(160,80,36,0)');
    c.fillStyle = fg;
    c.beginPath(); c.ellipse(556, 700, 380, 70, 0, 0, 6.2832); c.fill();
  }

  function buildRoom() {
    var lay = makeCanvas(1280, 720);
    if (!lay) return null;
    var c = lay.x;

    /* ---- 墙 ---- */
    wallPlanks(c);
    wallDetail(c);

    /* 墙面暖色渐变（光从右下方来） */
    var wg = c.createLinearGradient(0, 0, 1280, 720);
    wg.addColorStop(0, 'rgba(10,6,4,0.55)');
    wg.addColorStop(0.45, 'rgba(20,12,8,0.12)');
    wg.addColorStop(1, 'rgba(30,18,10,0.0)');
    c.fillStyle = wg;
    c.fillRect(0, 0, 1280, L.FLOOR_Y);

    /* ---- 顶梁 ---- */
    var beam = c.createLinearGradient(0, 0, 0, 118);
    beam.addColorStop(0, '#17100c');
    beam.addColorStop(0.45, '#2b1d15');
    beam.addColorStop(0.86, '#22160f');
    beam.addColorStop(1, '#120c09');
    c.fillStyle = beam;
    c.fillRect(0, 0, 1280, 118);
    c.fillStyle = 'rgba(255,200,140,0.05)';
    c.fillRect(0, 106, 1280, 2);
    /* 梁上木纹 */
    for (var b = 0; b < 26; b++) {
      var by = 14 + rnd(b * 4.7) * 92;
      c.strokeStyle = 'rgba(0,0,0,' + (0.05 + rnd(b) * 0.1) + ')';
      c.lineWidth = 1;
      c.beginPath();
      c.moveTo(0, by);
      for (var bx = 0; bx <= 1280; bx += 60) {
        c.lineTo(bx, by + Math.sin(bx * 0.02 + b) * 2.2);
      }
      c.stroke();
    }
    /* 椽子 */
    for (var rf = 0; rf < 5; rf++) {
      var rx = 120 + rf * 260;
      var rg = c.createLinearGradient(rx, 0, rx + 46, 0);
      rg.addColorStop(0, 'rgba(0,0,0,0.28)');
      rg.addColorStop(0.5, 'rgba(52,36,25,0.5)');
      rg.addColorStop(1, 'rgba(0,0,0,0.28)');
      c.fillStyle = rg;
      c.fillRect(rx, 0, 46, 104);
      c.fillStyle = 'rgba(0,0,0,0.25)';
      c.fillRect(rx + 44, 0, 2, 104);
    }

    /* ---- 地板 ---- */
    var fy = L.FLOOR_Y;
    var fg = c.createLinearGradient(0, fy - 14, 0, 720);
    fg.addColorStop(0, '#4a3527');
    fg.addColorStop(0.35, '#3e2c20');
    fg.addColorStop(1, '#241a13');
    c.fillStyle = fg;
    c.fillRect(0, fy - 12, 1280, 720 - fy + 12);

    /* 踢脚线 */
    c.fillStyle = '#1b120d';
    c.fillRect(0, fy - 12, 1280, 10);
    c.fillStyle = 'rgba(255,205,150,0.06)';
    c.fillRect(0, fy - 12, 1280, 1.5);

    /* 地板条 */
    var rows = [
      { y: fy, h: 16 }, { y: fy + 16, h: 18 }, { y: fy + 34, h: 22 }, { y: fy + 56, h: 26 }
    ];
    for (var ri = 0; ri < rows.length; ri++) {
      var ry = rows[ri].y, rh = rows[ri].h;
      var rgg = c.createLinearGradient(0, ry, 0, ry + rh);
      var shade = 1 - ri * 0.09;
      rgg.addColorStop(0, 'rgba(' + (74 * shade | 0) + ',' + (53 * shade | 0) + ',' + (38 * shade | 0) + ',1)');
      rgg.addColorStop(1, 'rgba(' + (50 * shade | 0) + ',' + (35 * shade | 0) + ',' + (25 * shade | 0) + ',1)');
      c.fillStyle = rgg;
      c.fillRect(0, ry, 1280, rh);
      c.fillStyle = 'rgba(14,9,6,0.6)';
      c.fillRect(0, ry + rh - 1.5, 1280, 1.5);
      /* 板头接缝 */
      var n = 5 + ((ri * 3) % 4);
      for (var si = 0; si < n; si++) {
        var sx = (si + rnd(ri * 8.1 + si) * 0.7) * (1280 / n);
        c.fillStyle = 'rgba(14,9,6,0.5)';
        c.fillRect(sx, ry, 1.4, rh);
      }
      /* 反光 */
      c.fillStyle = 'rgba(255,196,130,0.03)';
      c.fillRect(0, ry + 1, 1280, 1);
    }

    /* ---- 地毯（炉前） ---- */
    c.save();
    c.globalAlpha = 0.9;
    var matG = c.createRadialGradient(566, 700, 10, 566, 700, 250);
    matG.addColorStop(0, 'rgba(112,52,40,0.85)');
    matG.addColorStop(0.6, 'rgba(84,38,30,0.6)');
    matG.addColorStop(1, 'rgba(60,26,20,0)');
    c.fillStyle = matG;
    c.beginPath(); c.ellipse(566, 706, 260, 52, 0, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(196,146,86,0.16)';
    c.lineWidth = 2;
    c.beginPath(); c.ellipse(566, 704, 200, 38, 0, 0, 6.2832); c.stroke();
    c.restore();

    /* ---- 柴架 ---- */
    var wx = L.wood.x, wy = L.wood.y;
    c.fillStyle = 'rgba(24,16,11,0.85)';
    c.fillRect(wx - 8, wy + 96, L.wood.w + 16, 44);
    c.fillStyle = 'rgba(60,42,28,0.9)';
    c.fillRect(wx - 8, wy + 96, L.wood.w + 16, 7);

    /* ---- 桌子 ---- */
    var tx = L.table.x, ty = L.table.y, tw = L.table.w, th = L.table.h;
    c.fillStyle = '#2a1c13';
    c.fillRect(tx + 10, ty + 16, 12, th - 6);
    c.fillRect(tx + tw - 22, ty + 16, 12, th - 6);
    var tg = c.createLinearGradient(0, ty, 0, ty + 16);
    tg.addColorStop(0, '#5f4530');
    tg.addColorStop(1, '#3a2a1c');
    c.fillStyle = tg;
    rr(c, tx - 6, ty, tw + 12, 16, 3); c.fill();
    c.fillStyle = 'rgba(255,205,150,0.10)';
    c.fillRect(tx - 4, ty + 1, tw + 8, 1.6);
    /* 桌下阴影 */
    c.fillStyle = 'rgba(10,6,4,0.35)';
    c.beginPath(); c.ellipse(tx + tw / 2, ty + th + 4, tw * 0.5, 8, 0, 0, 6.2832); c.fill();

    /* ---- 凳子 ---- */
    var sx = L.stool.x, sy = L.stool.y;
    c.fillStyle = '#2d1f15';
    c.fillRect(sx + 8, sy + 14, 9, 54);
    c.fillRect(sx + L.stool.w - 17, sy + 14, 9, 54);
    var sg = c.createLinearGradient(0, sy, 0, sy + 16);
    sg.addColorStop(0, '#5a4029'); sg.addColorStop(1, '#33241a');
    c.fillStyle = sg;
    rr(c, sx, sy, L.stool.w, 15, 3); c.fill();
    c.fillStyle = 'rgba(255,200,140,0.10)';
    c.fillRect(sx + 2, sy + 1, L.stool.w - 4, 1.4);
    /* 坐垫 */
    c.fillStyle = 'rgba(126,52,42,0.85)';
    rr(c, sx + 3, sy - 12, L.stool.w - 6, 14, 6); c.fill();
    c.strokeStyle = 'rgba(196,146,86,0.25)'; c.lineWidth = 1;
    rr(c, sx + 3, sy - 12, L.stool.w - 6, 14, 6); c.stroke();

    /* ---- 地面阴影（家具下方） ---- */
    c.fillStyle = 'rgba(8,5,3,0.32)';
    c.beginPath(); c.ellipse(L.stove.x + L.stove.w / 2, 660, 190, 22, 0, 0, 6.2832); c.fill();
    c.beginPath(); c.ellipse(L.wood.x + L.wood.w / 2, 644, 96, 14, 0, 0, 6.2832); c.fill();

    /* ---- 门框 ---- */
    var dx = L.door.x, dy = L.door.y, dw = L.door.w, dh = L.door.h;
    c.fillStyle = '#1d130d';
    c.fillRect(dx - 16, dy - 16, dw + 32, dh + 22);
    var jg = c.createLinearGradient(dx - 16, 0, dx, 0);
    jg.addColorStop(0, '#3b2a1d'); jg.addColorStop(1, '#241811');
    c.fillStyle = jg;
    c.fillRect(dx - 16, dy - 16, 16, dh + 22);
    c.fillStyle = jg;
    c.fillRect(dx + dw, dy - 16, 16, dh + 22);
    var lg2 = c.createLinearGradient(0, dy - 16, 0, dy);
    lg2.addColorStop(0, '#4a3524'); lg2.addColorStop(1, '#2a1c13');
    c.fillStyle = lg2;
    c.fillRect(dx - 16, dy - 20, dw + 32, 22);
    c.fillStyle = 'rgba(255,200,140,0.08)';
    c.fillRect(dx - 14, dy - 19, dw + 28, 1.6);

    /* ---- 门槛外的雪（缝隙里的冷光） ---- */
    var gapG = c.createLinearGradient(0, dy + dh - 6, 0, dy + dh + 8);
    gapG.addColorStop(0, 'rgba(150,190,235,0.28)');
    gapG.addColorStop(1, 'rgba(150,190,235,0)');
    c.fillStyle = gapG;
    c.fillRect(dx, dy + dh - 5, dw, 13);

    /* ---- 窗户：外框 + 窗台 + 霜 ---- */
    var wx2 = L.window.x, wy2 = L.window.y, ww = L.window.w, wh = L.window.h;
    c.fillStyle = '#1c130d';
    rr(c, wx2 - 14, wy2 - 14, ww + 28, wh + 28, 3); c.fill();
    var wf = c.createLinearGradient(wx2 - 12, wy2 - 12, wx2 + ww, wy2 + wh);
    wf.addColorStop(0, '#4a3524');
    wf.addColorStop(0.5, '#33241a');
    wf.addColorStop(1, '#241811');
    c.fillStyle = wf;
    c.fillRect(wx2 - 12, wy2 - 12, ww + 24, 12);
    c.fillRect(wx2 - 12, wy2 + wh, ww + 24, 12);
    c.fillRect(wx2 - 12, wy2 - 12, 12, wh + 24);
    c.fillRect(wx2 + ww, wy2 - 12, 12, wh + 24);
    /* 窗棂 */
    c.fillStyle = '#3a2819';
    c.fillRect(L.glass.x, L.glass.y + L.glass.h * 0.42, L.glass.w, 9);
    c.fillRect(L.glass.x + L.glass.w * 0.5 - 4, L.glass.y, 8, L.glass.h);
    c.fillStyle = 'rgba(0,0,0,0.35)';
    c.fillRect(L.glass.x, L.glass.y + L.glass.h * 0.42 + 8, L.glass.w, 2);
    c.fillRect(L.glass.x + L.glass.w * 0.5 + 3, L.glass.y, 2, L.glass.h);
    /* 窗台 */
    c.fillStyle = '#3f2c1e';
    c.fillRect(L.sill.x, L.sill.y, L.sill.w, 14);
    c.fillStyle = '#5a4130';
    c.fillRect(L.sill.x, L.sill.y, L.sill.w, 4);
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.fillRect(L.sill.x, L.sill.y + 14, L.sill.w, 6);
    /* 玻璃上的霜 */
    var frost = c.createRadialGradient(L.glass.x + 20, L.glass.y + L.glass.h, 10,
      L.glass.x + 20, L.glass.y + L.glass.h, 130);
    frost.addColorStop(0, 'rgba(214,236,255,0.30)');
    frost.addColorStop(1, 'rgba(214,236,255,0)');
    c.fillStyle = frost;
    c.fillRect(L.glass.x, L.glass.y, L.glass.w, L.glass.h);
    var frost2 = c.createRadialGradient(L.glass.x + L.glass.w - 10, L.glass.y + 10, 6,
      L.glass.x + L.glass.w - 10, L.glass.y + 10, 90);
    frost2.addColorStop(0, 'rgba(214,236,255,0.22)');
    frost2.addColorStop(1, 'rgba(214,236,255,0)');
    c.fillStyle = frost2;
    c.fillRect(L.glass.x, L.glass.y, L.glass.w, L.glass.h);

    /* 窗花（红剪纸） */
    c.save();
    c.translate(L.glass.x + 40, L.glass.y + 40);
    c.strokeStyle = 'rgba(176,52,40,0.72)';
    c.lineWidth = 1.6;
    for (var pt = 0; pt < 6; pt++) {

      d.x += d.vx * dt;
      d.y += d.vy * dt;
      d.vy += 60 * dt;
    }
  };

  /* ---------- 绘制入口 ---------- */
  Scene.draw = function (g) {
    if (!ready || !Art.ready) return;
    var c = ctx;
    c.clearRect(0, 0, 1280, 720);
    c.save();
    var sh = g.shakeAmp || 0;
    if (sh > 0.05) {
      c.translate(Math.sin(g.t * 47) * sh, Math.sin(g.t * 63 + 1) * sh * 0.6);
    }

    drawOutside(g);
    c.drawImage(Art.room.c, 0, 0);

    drawDoor(g);
    drawWoodPile(g);
    drawStove(g);
    drawFire(g);
    drawPan(g);
    drawCombo(g);
    drawLamp(g);
    drawCat(g);
    drawPerson(g);
    drawSnowAccum(g);
    drawParticles(g);
    drawLight(g);
    drawHints(g);
    drawFloaters(g);

    c.restore();
    drawPost(g);
  };

  /* =========================================================
   * 窗外
   * ======================================================= */
  function drawOutside(g) {
    var c = ctx, gl = L.glass;
    c.save();
    c.beginPath();
    c.rect(gl.x, gl.y, gl.w, gl.h);
    c.clip();
    c.drawImage(Art.out.c, gl.x, gl.y);

    /* 夜幕随时间/回合变深 */
    c.fillStyle = 'rgba(8,14,30,' + (0.05 + g.round * 0.045) + ')';
    c.fillRect(gl.x, gl.y, gl.w, gl.h);

    /* 窗外的雪 */
    for (var i = 0; i < flakes.length; i++) {
      var f = flakes[i];
      var a = f.a * (0.55 + 0.45 * Math.sin(g.t * 2 + f.ph));
      c.fillStyle = 'rgba(232,242,255,' + a + ')';
      c.beginPath();
      c.arc(gl.x + f.x, gl.y + f.y, f.r, 0, 6.2832);
      c.fill();
    }

    /* 风起时的雪线 */
    if (g.gustT > 0.02) {
      c.save();
      c.globalAlpha = g.gustT * 0.5;
      c.strokeStyle = 'rgba(226,240,255,0.75)';
      c.lineWidth = 1.2;
      for (var k = 0; k < 16; k++) {
        var yy = gl.y + ((k * 37 + g.t * 320) % (gl.h + 40)) - 20;
        var xx = gl.x - 40 + ((k * 71 + g.t * 900) % (gl.w + 120));
        c.beginPath();
        c.moveTo(xx, yy);
        c.lineTo(xx + 26 + (k % 4) * 9, yy - 7);
        c.stroke();
      }
      c.restore();
    }

    /* 屋里的暖光映在窗玻璃上 */
    var warm = c.createRadialGradient(gl.x + gl.w * 0.1, gl.y + gl.h * 0.95, 20,
      gl.x + gl.w * 0.1, gl.y + gl.h * 0.95, gl.w * 0.85);
    warm.addColorStop(0, 'rgba(255,168,86,' + (0.16 + 0.14 * (g.fire / 100)) + ')');
    warm.addColorStop(1, 'rgba(255,150,70,0)');
    c.fillStyle = warm;
    c.fillRect(gl.x, gl.y, gl.w, gl.h);

    /* 天亮 */
    if (g.dawnT > 0) {
      var dg = c.createLinearGradient(0, gl.y + gl.h, 0, gl.y);
      dg.addColorStop(0, 'rgba(255,196,138,' + 0.55 * g.dawnT + ')');
      dg.addColorStop(0.45, 'rgba(255,214,176,' + 0.34 * g.dawnT + ')');
      dg.addColorStop(1, 'rgba(206,226,255,' + 0.30 * g.dawnT + ')');
      c.fillStyle = dg;
      c.fillRect(gl.x, gl.y, gl.w, gl.h);
    }
    c.restore();
  }

  /* =========================================================
   * 门（取柴时开合）
   * ======================================================= */
  function drawDoor(g) {
    var c = ctx;
    var d = L.door;
    var open = U.easeInOut(U.clamp(g.doorVis || 0, 0, 1));
    /* 有人叩门时门板会轻轻震 */
    var knock = (g.knockT > 0) ? Math.sin(g.t * 34) * 1.8 : 0;

    /* 门洞里的黑 + 冷光 */
    c.fillStyle = '#0a0d14';
    c.fillRect(d.x, d.y, d.w, d.h);
    if (open > 0.02) {
      var gl = c.createLinearGradient(d.x, d.y, d.x + d.w, d.y + d.h);
      gl.addColorStop(0, 'rgba(126,168,214,' + 0.30 * open + ')');
      gl.addColorStop(1, 'rgba(40,60,90,' + 0.1 * open + ')');
      c.fillStyle = gl;
      c.fillRect(d.x, d.y, d.w, d.h);
      /* 门外雪地 */
      c.fillStyle = 'rgba(196,222,252,' + 0.22 * open + ')';
      c.beginPath();
      c.moveTo(d.x, d.y + d.h);
      c.lineTo(d.x, d.y + d.h - 60);
      for (var x = 0; x <= d.w; x += 12) {
        c.lineTo(d.x + x, d.y + d.h - 60 + Math.sin(x * 0.05) * 8);
      }
      c.lineTo(d.x + d.w, d.y + d.h);
      c.closePath(); c.fill();
    }

    /* 门板（向内推开：用横向梯形模拟） */
    var leaves = 2;
    var leafW = d.w / leaves;
    c.save();
    c.translate(knock, 0);
    for (var i = 0; i < leaves; i++) {
      var sx = i === 0 ? d.x : d.x + leafW;
      var squeeze = 1 - open * 0.8;
      var w2 = leafW * (i === 0 ? squeeze : 1);
      var x2 = i === 0 ? d.x : d.x + d.w - w2;
      var grad = c.createLinearGradient(x2, d.y, x2 + w2, d.y + d.h);
      grad.addColorStop(0, '#4a3222');
      grad.addColorStop(0.55, '#38251a');
      grad.addColorStop(1, '#241710');
      c.fillStyle = grad;
      c.fillRect(x2, d.y, w2, d.h);
      /* 门板竖纹 */
      c.strokeStyle = 'rgba(18,11,7,0.5)';
      c.lineWidth = 1;
      for (var p = 1; p < 4; p++) {
        var px = x2 + (w2 / 4) * p;
        c.beginPath(); c.moveTo(px, d.y + 4); c.lineTo(px, d.y + d.h - 4); c.stroke();
      }
      /* 横档 */
      c.fillStyle = 'rgba(60,40,26,0.85)';
      c.fillRect(x2, d.y + d.h * 0.22, w2, 12);
      c.fillRect(x2, d.y + d.h * 0.68, w2, 12);
      c.fillStyle = 'rgba(0,0,0,0.3)';
      c.fillRect(x2, d.y + d.h * 0.22 + 12, w2, 2);
      c.fillRect(x2, d.y + d.h * 0.68 + 12, w2, 2);
    }
    c.restore();
    /* 门环 */
    if (open < 0.4) {
      c.strokeStyle = 'rgba(178,146,92,0.8)';
      c.lineWidth = 3;
      c.beginPath(); c.arc(d.x + d.w * 0.42, d.y + d.h * 0.48, 10, 0, 6.2832); c.stroke();
      c.fillStyle = 'rgba(70,50,30,0.9)';
      c.beginPath(); c.arc(d.x + d.w * 0.42, d.y + d.h * 0.48 - 10, 4, 0, 6.2832); c.fill();
    }
    /* 棉门帘 */
    c.save();
    var cg = c.createLinearGradient(d.x, d.y, d.x + d.w, d.y);
    cg.addColorStop(0, 'rgba(102,45,36,0.97)');
    cg.addColorStop(0.5, 'rgba(128,58,44,0.97)');
    cg.addColorStop(1, 'rgba(86,35,27,0.97)');
    c.fillStyle = cg;
    var hemY = d.y + 152;
    c.beginPath();
    c.moveTo(d.x - 5, d.y - 6);
    c.lineTo(d.x + d.w + 5, d.y - 6);
    c.lineTo(d.x + d.w + 5, hemY - 8);
    for (var fx = d.w + 5; fx >= -5; fx -= 12) {
      c.lineTo(d.x + fx, hemY + Math.sin(fx * 0.09 + 1.3) * 7 + Math.sin(fx * 0.031) * 4);
    }
    c.closePath();
    c.fill();
    /* 竖褶 */
    for (var fk = 1; fk < 7; fk++) {
      var ffx = d.x + (d.w / 7) * fk;
      c.fillStyle = fk % 2 ? 'rgba(0,0,0,0.14)' : 'rgba(255,200,160,0.05)';
      c.fillRect(ffx - 3, d.y - 4, 6, 142);
    }
    /* 系带 */
    c.fillStyle = 'rgba(66,34,22,0.92)';
    c.fillRect(d.x - 4, d.y + 68, d.w + 8, 7);
    /* 暗纹 */
    c.strokeStyle = 'rgba(216,172,108,0.18)';
    c.lineWidth = 1.4;
    c.beginPath();
    c.moveTo(d.x + 2, d.y + 98);
    c.quadraticCurveTo(d.x + d.w / 2, d.y + 120, d.x + d.w - 2, d.y + 96);
    c.stroke();
    c.restore();
  }

  /* =========================================================
   * 柴堆：数量随 wood 变化
   * ======================================================= */
  function drawWoodPile(g) {
    var c = ctx;
    var w = L.wood;

    /* 柴架 */
    c.fillStyle = 'rgba(22,14,9,0.92)';
    c.fillRect(w.x - 10, w.y + 112, w.w + 20, 15);
    c.fillRect(w.x - 10, w.y + 127, 12, 22);
    c.fillRect(w.x + w.w - 2, w.y + 127, 12, 22);
    c.fillStyle = 'rgba(78,53,34,0.9)';
    c.fillRect(w.x - 10, w.y + 109, w.w + 20, 5);
    c.fillStyle = 'rgba(0,0,0,0.32)';
    c.fillRect(w.x - 10, w.y + 125, w.w + 20, 2);

    /* 木柴的断面朝外堆成垛（9 个堆位，从下往上一根根码） */
    var slots = [
      { x: w.x + 22, y: w.y + 108 }, { x: w.x + 58, y: w.y + 108 }, { x: w.x + 94, y: w.y + 108 },
      { x: w.x + 40, y: w.y + 84 }, { x: w.x + 76, y: w.y + 84 }, { x: w.x + 112, y: w.y + 84 },
      { x: w.x + 58, y: w.y + 60 }, { x: w.x + 94, y: w.y + 60 },
      { x: w.x + 76, y: w.y + 36 }
    ];
    var n = U.clamp(Math.round(g.wood), 0, 9);
    for (var i = 0; i < n; i++) drawLogEnd(c, slots[i].x, slots[i].y);

    if (n === 0) {
      c.fillStyle = 'rgba(178,198,222,0.4)';
      c.font = '13px "KaiTi","STKaiti",serif';
      c.textAlign = 'center';
      c.fillText('柴垛空了', w.x + w.w / 2, w.y + 90);
      c.textAlign = 'left';
    }
  }

  function drawLogEnd(c, x, y) {
    var r = 15;
    var g = c.createRadialGradient(x - r * 0.34, y - r * 0.34, 1, x, y, r);
    g.addColorStop(0, '#b8843f');
    g.addColorStop(0.55, '#8f6231');
    g.addColorStop(1, '#33200f');
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, 6.2832); c.fill();
    /* 年轮 */
    c.strokeStyle = 'rgba(94,56,24,0.5)';
    c.lineWidth = 1.1;
    for (var k = 1; k <= 3; k++) {
      c.beginPath(); c.arc(x, y, r * (0.2 + k * 0.2), 0, 6.2832); c.stroke();
    }
    c.fillStyle = 'rgba(70,40,18,0.7)';
    c.beginPath(); c.arc(x, y, r * 0.13, 0, 6.2832); c.fill();
    /* 树皮缺口 */
    c.strokeStyle = 'rgba(40,24,12,0.55)';
    c.lineWidth = 2.6;
    c.beginPath(); c.arc(x, y, r - 1, -0.55, 0.3); c.stroke();
    /* 雪 */
    c.fillStyle = 'rgba(228,242,255,0.72)';
    c.beginPath();
    c.ellipse(x - r * 0.06, y - r * 0.76, r * 0.6, r * 0.23, -0.14, 0, 6.2832);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.beginPath();
    c.ellipse(x - r * 0.32, y - r * 0.42, r * 0.18, r * 0.5, -0.5, 0, 6.2832);
    c.fill();
  }

  /* =========================================================
   * 灶台
   * ======================================================= */
  function archPath(c, fb) {
    c.beginPath();
    c.moveTo(fb.x, fb.y + fb.h);
    c.lineTo(fb.x, fb.y + 26);
    c.quadraticCurveTo(fb.x + fb.w / 2, fb.y - 26, fb.x + fb.w, fb.y + 26);
    c.lineTo(fb.x + fb.w, fb.y + fb.h);
    c.closePath();
  }

  function drawStove(g) {
    var c = ctx;
    var s = L.stove, sl = L.slab, fb = L.firebox;

    /* ---- 灶身 ---- */
    var bodyG = c.createLinearGradient(0, sl.y + sl.h, 0, s.y + s.h);
    bodyG.addColorStop(0, '#6d4c33');
    bodyG.addColorStop(0.3, '#583c29');
    bodyG.addColorStop(1, '#2a1c13');
    c.fillStyle = bodyG;
    U.roundRect(c, s.x, sl.y + sl.h - 8, s.w, s.h - sl.h, 12);
    c.fill();

    /* 砖缝 */
    c.strokeStyle = 'rgba(22,13,8,0.42)';
    c.lineWidth = 1.2;
    for (var r = 1; r <= 4; r++) {
      var y = sl.y + sl.h + (s.h - sl.h) * (r / 5);
      c.beginPath(); c.moveTo(s.x + 5, y); c.lineTo(s.x + s.w - 5, y); c.stroke();
    }
    for (var q = 0; q < 9; q++) {
      var bx = s.x + 16 + ((s.w - 32) / 9) * q;
      var row = q % 2;
      c.beginPath();
      c.moveTo(bx, sl.y + sl.h + (row ? 0 : 28));
      c.lineTo(bx, sl.y + sl.h + (row ? 28 : 56));
      c.stroke();
    }
    /* 灶脚阴影 */
    c.fillStyle = 'rgba(8,4,2,0.42)';
    c.beginPath();
    c.ellipse(s.x + s.w / 2, s.y + s.h - 2, s.w * 0.52, 12, 0, 0, 6.2832);
    c.fill();

    /* ---- 灶台面 ---- */
    var topG = c.createLinearGradient(0, sl.y, 0, sl.y + sl.h);
    topG.addColorStop(0, '#8f6846');
    topG.addColorStop(0.45, '#6f4c31');
    topG.addColorStop(1, '#4b3222');
    c.fillStyle = topG;
    U.roundRect(c, sl.x, sl.y, sl.w, sl.h, 7);
    c.fill();
    c.fillStyle = 'rgba(255,220,168,0.18)';
    c.fillRect(sl.x + 8, sl.y + 2, sl.w - 16, 2);
    c.fillStyle = 'rgba(0,0,0,0.38)';
    c.fillRect(sl.x + 6, sl.y + sl.h - 4, sl.w - 12, 5);
    /* 台面砖线 */
    c.strokeStyle = 'rgba(30,18,10,0.30)';
    c.lineWidth = 1;
    for (var t2 = 1; t2 < 4; t2++) {
      var txx = sl.x + sl.w * (t2 / 4);
      c.beginPath(); c.moveTo(txx, sl.y + 4); c.lineTo(txx, sl.y + sl.h - 4); c.stroke();
    }

    /* ---- 灶口 ---- */
    c.save();
    archPath(c, fb);
    c.clip();
    var inner = c.createRadialGradient(fb.x + fb.w / 2, fb.y + fb.h, 8,
      fb.x + fb.w / 2, fb.y + fb.h, fb.w * 0.72);
    inner.addColorStop(0, '#1e0f07');
    inner.addColorStop(1, '#070302');
    c.fillStyle = inner;
    c.fillRect(fb.x - 6, fb.y - 30, fb.w + 12, fb.h + 34);
    c.restore();

    /* 灶口边沿（砖砌拱） */
    c.strokeStyle = '#33200f';
    c.lineWidth = 9;
    archPath(c, fb);
    c.stroke();
    c.strokeStyle = 'rgba(140,100,62,0.35)';
    c.lineWidth = 1.6;
    c.beginPath();
    c.moveTo(fb.x + 3, fb.y + 30);
    c.quadraticCurveTo(fb.x + fb.w / 2, fb.y - 20, fb.x + fb.w - 3, fb.y + 30);
    c.stroke();
    /* 灶口上沿的熏黑 */
    var soot = c.createRadialGradient(fb.x + fb.w / 2, fb.y - 10, 10,
      fb.x + fb.w / 2, fb.y - 10, fb.w * 0.75);
    soot.addColorStop(0, 'rgba(10,6,4,0.55)');
    soot.addColorStop(1, 'rgba(10,6,4,0)');
    c.fillStyle = soot;
    c.fillRect(fb.x - 40, fb.y - 70, fb.w + 80, 110);

    /* ---- 铁锅（平底锅）---- */
    var p = L.pan;
    c.fillStyle = 'rgba(8,4,2,0.45)';
    c.beginPath(); c.ellipse(p.x, p.y + 20, p.r * 1.02, 9, 0, 0, 6.2832); c.fill();
    /* 锅柄 */
    c.strokeStyle = '#2b1d13';
    c.lineWidth = 14;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(p.x + p.r * 0.74, p.y + 1);
    c.lineTo(p.x + p.r + 54, p.y - 6);
    c.stroke();
    c.strokeStyle = 'rgba(130,96,58,0.55)';
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(p.x + p.r * 0.78, p.y - 1);
    c.lineTo(p.x + p.r + 50, p.y - 8);
    c.stroke();
    /* 锅身 */
    var panG = c.createLinearGradient(0, p.y - 20, 0, p.y + 24);
    panG.addColorStop(0, '#544940');
    panG.addColorStop(0.35, '#2f2923');
    panG.addColorStop(1, '#16120f');
    c.fillStyle = panG;
    c.beginPath();
    c.ellipse(p.x, p.y, p.r, 20, 0, 0, 6.2832);
    c.fill();
    /* 锅沿高光 */
    c.strokeStyle = 'rgba(196,168,124,0.35)';
    c.lineWidth = 2;
    c.beginPath();
    c.ellipse(p.x, p.y - 1, p.r - 2, 18, 0, Math.PI * 1.02, Math.PI * 1.98);
    c.stroke();
    /* 锅底油光 */
    var oil = c.createRadialGradient(p.x - 10, p.y - 6, 2, p.x, p.y, p.r);
    oil.addColorStop(0, 'rgba(120,80,36,0.35)');
    oil.addColorStop(1, 'rgba(20,12,8,0)');
    c.fillStyle = oil;
    c.beginPath();
    c.ellipse(p.x, p.y - 2, p.r - 5, 16, 0, 0, 6.2832);
    c.fill();

    /* ---- 水壶 ---- */
    var kx = 648, ky = 436;
    c.fillStyle = 'rgba(8,4,2,0.4)';
    c.beginPath(); c.ellipse(kx, ky + 26, 20, 6, 0, 0, 6.2832); c.fill();
    var kg = c.createLinearGradient(kx - 18, ky, kx + 18, ky + 12);
    kg.addColorStop(0, '#5c4a3a');
    kg.addColorStop(0.6, '#3a2d22');
    kg.addColorStop(1, '#241a13');
    c.fillStyle = kg;
    c.beginPath();
    c.moveTo(kx - 15, ky + 4);
    c.quadraticCurveTo(kx - 20, ky + 22, kx, ky + 24);
    c.quadraticCurveTo(kx + 20, ky + 22, kx + 15, ky + 4);
    c.closePath();
    c.fill();
    c.strokeStyle = '#31251a';
    c.lineWidth = 3.4;
    c.beginPath(); c.arc(kx, ky + 2, 9, Math.PI * 1.05, Math.PI * 1.95); c.stroke();
    c.fillStyle = '#6f5c48';
    c.beginPath(); c.ellipse(kx, ky + 4, 15, 5, 0, 0, 6.2832); c.fill();
    c.fillStyle = '#3a2d22';
    c.beginPath(); c.ellipse(kx + 14, ky + 6, 8, 4, 0.3, 0, 6.2832); c.fill();
    c.strokeStyle = 'rgba(220,190,140,0.28)';
    c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(kx - 10, ky + 8); c.lineTo(kx - 12, ky + 20); c.stroke();
  }

  /* =========================================================
   * 火
   * ======================================================= */
  function drawFire(g) {
    var c = ctx;
    var fb = L.firebox;
    var f = U.clamp(g.fire / 100, 0, 1);
    var t = g.t;

    /* ---- 灶膛内部 ---- */
    c.save();
    archPath(c, fb);
    c.clip();
    var inner = c.createLinearGradient(0, fb.y - 26, 0, fb.y + fb.h);
    inner.addColorStop(0, '#1b0d06');
    inner.addColorStop(1, '#070302');
    c.fillStyle = inner;
    c.fillRect(fb.x - 6, fb.y - 30, fb.w + 12, fb.h + 34);

    /* 灰床 */
    c.fillStyle = 'rgba(66,56,48,0.5)';
    c.beginPath();
    c.ellipse(fb.x + fb.w / 2, fb.y + fb.h - 5, fb.w * 0.45, 11, 0, 0, 6.2832);
    c.fill();

    /* 柴 */
    function logAt(x1, y1, x2, y2, wdt) {
      c.strokeStyle = '#2a160b';
      c.lineWidth = wdt;
      c.lineCap = 'round';
      c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke();
      if (f > 0.03) {
        c.strokeStyle = 'rgba(255,140,46,' + (0.3 + 0.45 * f) + ')';
        c.lineWidth = wdt * 0.4;
        c.beginPath(); c.moveTo(x1, y1 - 1); c.lineTo(x2, y2 - 1); c.stroke();
      }
    }
    logAt(fb.x + 26, fb.y + fb.h - 9, fb.x + fb.w * 0.58, fb.y + fb.h - 34, 9);
    logAt(fb.x + fb.w - 22, fb.y + fb.h - 11, fb.x + fb.w * 0.42, fb.y + fb.h - 40, 8);
    logAt(fb.x + 42, fb.y + fb.h - 27, fb.x + fb.w - 34, fb.y + fb.h - 23, 7);

    var baseY = fb.y + fb.h - 4;

    if (f <= 0.025) {
      /* 火熄了，只剩余烬 */
      for (var e0 = 0; e0 < 9; e0++) {
        var ex = fb.x + fb.w * (0.16 + 0.68 * R());
        var ey = fb.y + fb.h - 7 - R() * 9;
        var ea = 0.12 + 0.22 * (0.5 + 0.5 * Math.sin(t * 2.2 + e0 * 1.7));
        c.fillStyle = 'rgba(196,70,22,' + ea + ')';
        c.beginPath(); c.arc(ex, ey, 1.4 + R() * 2.2, 0, 6.2832); c.fill();
      }
      c.restore();
      return;
    }

    /* ---- 火焰 ---- */
    c.globalCompositeOperation = 'lighter';
    var hMax = fb.h * 1.02;

    function tongue(cx, hgt, wdt, col0, col1, alpha) {
      var tipX = cx + Math.sin(t * 2.4 + cx * 0.07) * wdt * 1.8;
      var grd = c.createLinearGradient(0, baseY, 0, baseY - hgt);
      grd.addColorStop(0, col0);
      grd.addColorStop(0.45, col1);
      grd.addColorStop(1, 'rgba(120,24,6,0)');
      c.globalAlpha = alpha;
      c.fillStyle = grd;
      c.beginPath();
      c.moveTo(cx - wdt, baseY);
      c.bezierCurveTo(cx - wdt * 1.35, baseY - hgt * 0.4, tipX - wdt * 0.55, baseY - hgt * 0.7, tipX, baseY - hgt);
      c.bezierCurveTo(tipX + wdt * 0.75, baseY - hgt * 0.66, cx + wdt * 1.3, baseY - hgt * 0.35, cx + wdt, baseY);
      c.closePath();
      c.fill();
      c.globalAlpha = 1;
    }

    var i;
    for (i = 0; i < 6; i++) {
      var fx = fb.x + fb.w * (0.13 + 0.74 * (i / 5));
      var wob = U.noise(t * 1.6 + i * 2.3);
      var h1 = hMax * (0.42 + 0.58 * f) * (0.78 + 0.34 * wob);
      tongue(fx, h1, fb.w * 0.09, 'rgba(255,192,84,0.5)', 'rgba(230,88,22,0.3)', 0.9);
    }
    for (i = 0; i < 4; i++) {
      var fx2 = fb.x + fb.w * (0.28 + 0.44 * (i / 3)) + Math.sin(t * 1.1 + i) * 3;
      var h2 = hMax * (0.55 + 0.45 * f) * (0.82 + 0.3 * U.noise(t * 2.1 + i * 1.3));
      tongue(fx2, h2, fb.w * 0.058, 'rgba(255,246,200,0.92)', 'rgba(255,152,48,0.42)', 0.95);
    }
    /* 白热核心 */
    var core = c.createRadialGradient(fb.x + fb.w / 2, baseY - 8, 2,
      fb.x + fb.w / 2, baseY - 8, fb.w * 0.52);
    core.addColorStop(0, 'rgba(255,252,228,' + (0.35 + 0.5 * f) + ')');
    core.addColorStop(0.42, 'rgba(255,182,84,' + (0.22 + 0.28 * f) + ')');
    core.addColorStop(1, 'rgba(255,140,50,0)');
    c.fillStyle = core;
    c.fillRect(fb.x, fb.y - 24, fb.w, fb.h + 24);

    c.globalAlpha = 1;
    c.globalCompositeOperation = 'source-over';
    c.restore();

    /* ---- 飞出灶口的火星 ---- */
    c.save();
    c.globalCompositeOperation = 'lighter';
    for (var e = 0; e < embers.length; e++) {
      var p = embers[e];
      if (p.life <= 0) continue;
      var lr = p.life / p.max;
      c.fillStyle = 'rgba(255,' + ((140 + 92 * lr) | 0) + ',80,' + (lr * 0.85) + ')';
      c.beginPath();
      c.arc(p.x, p.y, p.r * (0.45 + lr * 0.85), 0, 6.2832);
      c.fill();
    }
    c.restore();

    /* ---- 灶口外溢的光 ---- */
    c.save();
    c.globalCompositeOperation = 'lighter';
    var spill = c.createRadialGradient(fb.x + fb.w / 2, fb.y + 6, 6,
      fb.x + fb.w / 2, fb.y + 6, 150 + f * 130);
    spill.addColorStop(0, 'rgba(255,168,80,' + (0.20 * f + 0.06) + ')');
    spill.addColorStop(1, 'rgba(255,140,60,0)');
    c.fillStyle = spill;
    c.beginPath();
    c.arc(fb.x + fb.w / 2, fb.y + 6, 150 + f * 130, 0, 6.2832);
    c.fill();
    c.restore();
  }

  /* =========================================================
   * 糍粑
   * ======================================================= */
  function drawPan(g) {
    var c = ctx;
    var p = L.pan;
    var t = g.cakeT;
    var burnt = g.cakeBurnt;
    var doneness = U.clamp((t - 0.4) / 4.0, 0, 1);

    if (g.cakeCd > 0.55) {
      /* 刚翻过，盘里空着 */
      return;
    }

    var rx = 34, ry = 12;
    var cx = p.x, cy = p.y - 8;
    var col0, col1, edge;
    if (burnt) {
      col0 = '#3a261a'; col1 = '#1c1109'; edge = '#5a3a22';
    } else {
      col0 = '#' + mixHex('#f4e6bc', '#d8a24c', doneness);
      col1 = '#' + mixHex('#e8d3a0', '#a8702c', doneness);
      edge = '#' + mixHex('#f8eecd', '#e0b268', doneness);
    }
    var cg = c.createLinearGradient(0, cy - ry, 0, cy + ry);
    cg.addColorStop(0, col0);
    cg.addColorStop(1, col1);
    c.fillStyle = cg;
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    c.fill();
    c.strokeStyle = edge;
    c.lineWidth = 1.6;
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    c.stroke();

    /* 鼓泡 */
    if (!burnt && t > 1.6) {
      var bcount = Math.min(7, Math.floor((t - 1.6) * 2.4));
      for (var i = 0; i < bcount; i++) {
        var ang = (i / bcount) * 6.2832 + g.t * 0.6;
        var bx = cx + Math.cos(ang) * rx * 0.5;
        var by = cy + Math.sin(ang) * ry * 0.45;
        var rr2 = 1.6 + Math.abs(Math.sin(g.t * 3 + i)) * 1.6;
        c.fillStyle = 'rgba(120,72,26,0.35)';
        c.beginPath(); c.arc(bx, by, rr2, 0, 6.2832); c.fill();
        c.fillStyle = 'rgba(255,246,214,0.45)';
        c.beginPath(); c.arc(bx - 0.6, by - 0.6, rr2 * 0.5, 0, 6.2832); c.fill();
      }
    }
    /* 焦斑 */
    if (burnt) {
      c.fillStyle = 'rgba(12,6,3,0.75)';
      for (var k = 0; k < 4; k++) {
        c.beginPath();
        c.arc(cx - 16 + k * 11, cy + Math.sin(k * 2) * 4, 4 + k, 0, 6.2832);
        c.fill();
      }
    }
    /* 油光 */
    var shine = c.createLinearGradient(cx - rx, cy - ry, cx + rx, cy);
    shine.addColorStop(0, 'rgba(255,255,240,' + (burnt ? 0.06 : 0.28) + ')');
    shine.addColorStop(0.45, 'rgba(255,255,240,0)');
    c.fillStyle = shine;
    c.beginPath();
    c.ellipse(cx, cy, rx, ry, 0, 0, 6.2832);
    c.fill();

    /* 汽与烟 */
    c.save();
    c.globalCompositeOperation = 'source-over';
    for (var m = 0; m < smokes.length; m++) {
      var s = smokes[m];
      if (s.life <= 0) continue;
      var lr = s.life / s.max;
      if (s.type === 0) {
        c.fillStyle = 'rgba(150,142,132,' + (lr * 0.09) + ')';
      } else if (s.type === 2) {
        c.fillStyle = 'rgba(220,232,244,' + (lr * 0.10) + ')';
      } else {
        c.fillStyle = 'rgba(226,232,238,' + (lr * 0.085) + ')';
      }
      c.beginPath();
      c.arc(s.x, s.y, s.r, 0, 6.2832);
      c.fill();
    }
    c.restore();

    /* 水壶 */
    c.save();
    var kx = 648, ky = 436;
    var kg = c.createLinearGradient(kx - 18, ky, kx + 18, ky + 12);
    kg.addColorStop(0, '#5c4a3a');
    kg.addColorStop(1, '#2e241b');
    c.fillStyle = kg;
    c.beginPath();
    c.moveTo(kx - 16, ky + 4);
    c.quadraticCurveTo(kx - 20, ky + 22, kx, ky + 24);
    c.quadraticCurveTo(kx + 20, ky + 22, kx + 16, ky + 4);
    c.closePath();
    c.fill();
    c.strokeStyle = '#31251a';
    c.lineWidth = 3;
    c.beginPath(); c.arc(kx, ky + 2, 8, Math.PI, 0); c.stroke();
    c.fillStyle = '#6b5847';
    c.beginPath(); c.ellipse(kx, ky + 4, 16, 5, 0, 0, 6.2832); c.fill();
    c.fillStyle = '#3a2d22';
    c.beginPath(); c.ellipse(kx + 15, ky + 6, 7, 4, 0.3, 0, 6.2832); c.fill();
    c.restore();
  }

  function mixHex(a, b, t) {
    t = U.clamp(t, 0, 1);
    var pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
    var r = ((pa >> 16) & 255) * (1 - t) + ((pb >> 16) & 255) * t;
    var g = ((pa >> 8) & 255) * (1 - t) + ((pb >> 8) & 255) * t;
    var bl = (pa & 255) * (1 - t) + (pb & 255) * t;
    return ((r | 0) << 16 | (g | 0) << 8 | (bl | 0)).toString(16).padStart(6, '0');
  }

  /* =========================================================
   * 焦香连击的角标
   * ======================================================= */
  function drawCombo(g) {
    if (!g.combo || g.combo < 2) return;
    var c = ctx;
    var p = L.pan;
    var y = p.y - 152;
    var pulse = 0.8 + 0.2 * Math.sin(g.t * 6);
    c.save();
    c.font = '17px "KaiTi","STKaiti",楷体,serif';
    c.textAlign = 'center';
    c.fillStyle = 'rgba(10,6,3,0.55)';
    c.fillText('焦香 ×' + g.combo, p.x + 1.4, y + 1.4);
    c.fillStyle = 'rgba(255,226,152,' + pulse + ')';
    c.fillText('焦香 ×' + g.combo, p.x, y);
    /* 小火星 */
    c.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 3; i++) {
      var ph = (g.t * 1.4 + i * 0.34) % 1;
      c.fillStyle = 'rgba(255,210,130,' + (0.5 * (1 - ph)) + ')';
      c.beginPath();
      c.arc(p.x - 30 + i * 30, y - 6 - ph * 16, 1.8 * (1 - ph) + 0.6, 0, 6.2832);
      c.fill();
    }
    c.globalCompositeOperation = 'source-over';
    c.restore();
  }

  /* =========================================================
   * 油灯
   * ======================================================= */
  function drawLamp(g) {
    var c = ctx;
    var x = L.lamp.x, y = L.lamp.y - 4;
    var flick = 0.82 + 0.18 * U.noise(g.t * 6.2);
    c.save();
    c.globalCompositeOperation = 'lighter';
    var gl = c.createRadialGradient(x, y, 1, x, y, 92 * flick);
    gl.addColorStop(0, 'rgba(255,224,160,' + (0.5 * flick) + ')');
    gl.addColorStop(0.3, 'rgba(255,180,90,' + (0.16 * flick) + ')');
    gl.addColorStop(1, 'rgba(255,160,60,0)');
    c.fillStyle = gl;
    c.fillRect(x - 100, y - 100, 200, 200);
    /* 灯焰 */
    var fh = 15 * flick;
    var fg = c.createLinearGradient(0, y, 0, y - fh);
    fg.addColorStop(0, 'rgba(255,255,225,0.95)');
    fg.addColorStop(0.5, 'rgba(255,206,110,0.8)');
    fg.addColorStop(1, 'rgba(255,150,40,0)');
    c.fillStyle = fg;
    c.beginPath();
    c.moveTo(x - 3.4, y);
    c.quadraticCurveTo(x - 2, y - fh * 0.6, x + Math.sin(g.t * 7) * 1.6, y - fh);
    c.quadraticCurveTo(x + 2, y - fh * 0.6, x + 3.4, y);
    c.closePath();
    c.fill();
    c.restore();
  }

  /* =========================================================
   * 猫
   * ======================================================= */
  function drawCat(g) {
    if (!g.catShow) return;
    var c = ctx;
    var bob = Math.sin(g.t * 1.7) * 1.2;
    var pet = g.catPetT > 0;
    var x = L.cat.x + L.cat.w / 2, y = L.cat.y + 26 + bob;

    c.save();
    c.translate(x, y);
    if (pet) c.translate(0, -2);
    /* 尾巴 */
    c.strokeStyle = '#4e3b2d';
    c.lineWidth = 7;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(26, 2);
    c.quadraticCurveTo(52, 6 + Math.sin(g.t * 3) * 5, 40, -16 + Math.sin(g.t * 2) * 4);
    c.stroke();
    /* 身体（蜷成一团） */
    var bodyG = c.createRadialGradient(-8, -12, 4, 0, 0, 40);
    bodyG.addColorStop(0, '#7a604a');
    bodyG.addColorStop(0.7, '#5c4634');
    bodyG.addColorStop(1, '#3f3024');
    c.fillStyle = bodyG;
    c.beginPath();
    c.ellipse(0, 0, 34, 20, 0, 0, 6.2832);
    c.fill();
    /* 条纹 */
    c.strokeStyle = 'rgba(40,28,18,0.5)';
    c.lineWidth = 3;
    for (var i = 0; i < 3; i++) {
      c.beginPath();
      c.arc(-4 + i * 10, 2, 12, Math.PI * 1.15, Math.PI * 1.75);
      c.stroke();
    }
    /* 头 */
    var hx = -20, hy = -6 + (pet ? -2 : 0);
    c.fillStyle = '#6b5340';
    c.beginPath();
    c.arc(hx, hy, 14, 0, 6.2832);
    c.fill();
    /* 耳朵 */
    c.fillStyle = '#6b5340';
    c.beginPath(); c.moveTo(hx - 12, hy - 8); c.lineTo(hx - 6, hy - 20); c.lineTo(hx - 1, hy - 11); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(hx + 11, hy - 9); c.lineTo(hx + 6, hy - 21); c.lineTo(hx + 1, hy - 11); c.closePath(); c.fill();
    c.fillStyle = 'rgba(200,140,120,0.55)';
    c.beginPath(); c.moveTo(hx - 9, hy - 10); c.lineTo(hx - 6, hy - 16); c.lineTo(hx - 3, hy - 11); c.closePath(); c.fill();
    /* 眼睛 */
    if (pet) {
      c.fillStyle = '#f4e2a8';
      c.beginPath(); c.arc(hx - 5, hy - 2, 3, 0, 6.2832); c.fill();
      c.beginPath(); c.arc(hx + 5, hy - 2, 3, 0, 6.2832); c.fill();
      c.fillStyle = '#2a1c12';
      c.beginPath(); c.arc(hx - 5, hy - 2, 1.4, 0, 6.2832); c.fill();
      c.beginPath(); c.arc(hx + 5, hy - 2, 1.4, 0, 6.2832); c.fill();
    } else {
      c.strokeStyle = '#2a1c12';
      c.lineWidth = 1.6;
      c.beginPath(); c.arc(hx - 5, hy - 1, 3, 0.25, Math.PI - 0.25); c.stroke();
      c.beginPath(); c.arc(hx + 5, hy - 1, 3, 0.25, Math.PI - 0.25); c.stroke();
    }
    /* 鼻子 */
    c.fillStyle = 'rgba(190,120,110,0.85)';
    c.beginPath(); c.arc(hx, hy + 4, 1.6, 0, 6.2832); c.fill();
    /* 雪沾在毛上 */
    c.fillStyle = 'rgba(226,240,255,0.35)';
    c.beginPath(); c.ellipse(14, -12, 7, 2.4, -0.3, 0, 6.2832); c.fill();
    c.restore();

    /* 撸猫的心 */
    if (pet) {
      var n = Math.min(3, Math.ceil(g.catPetT * 3));
      for (var k = 0; k < n; k++) {
        var ph = (g.catPetT * 1.6 + k * 0.33) % 1;
        c.globalAlpha = Math.sin(ph * Math.PI) * 0.9;
        c.fillStyle = '#ff8f7a';
        drawHeart(c, x + 12 + Math.sin(k * 2 + g.t * 2) * 10, y - 30 - ph * 34, 5);
      }
      c.globalAlpha = 1;
    }
  }

  function drawHeart(c, x, y, s) {
    c.beginPath();
    c.moveTo(x, y + s * 0.8);
    c.bezierCurveTo(x - s * 1.5, y - s * 0.4, x - s * 0.5, y - s * 1.4, x, y - s * 0.5);
    c.bezierCurveTo(x + s * 0.5, y - s * 1.4, x + s * 1.5, y - s * 0.4, x, y + s * 0.8);
    c.fill();
  }

  /* =========================================================
   * 人
   * ======================================================= */
  function drawPerson(g) {
    var c = ctx;
    var ch = g.char;
    var x = ch.x;
    var groundY = 648;
    var stand = ch.stand;      /* 0 坐, 1 站 */
    var shiver = g.warmth < 38 ? Math.sin(g.t * 26) * (38 - g.warmth) * 0.035 : 0;
    var bob = Math.sin(g.t * 1.5) * 1.3 * (1 - stand);

    c.save();
    c.translate(x + shiver, groundY + bob);
    /* 影子 */
    c.fillStyle = 'rgba(6,3,2,0.35)';
    c.beginPath();
    c.ellipse(0, 2, 30 + stand * 2, 7, 0, 0, 6.2832);
    c.fill();

    var hipY = U.lerp(-58, -86, stand);
    var bodyTop = U.lerp(-122, -150, stand);
    var headY = bodyTop - 30;

    /* 腿 */
    c.strokeStyle = '#33261d';
    c.lineWidth = 13;
    c.lineCap = 'round';
    if (stand > 0.5) {
      var walk = Math.sin(g.t * 9) * 5 * (ch.walking ? 1 : 0);
      c.beginPath(); c.moveTo(-5, hipY + 4); c.lineTo(-8 + walk, -2); c.stroke();
      c.beginPath(); c.moveTo(6, hipY + 4); c.lineTo(9 - walk, -2); c.stroke();
      c.fillStyle = '#241a13';
      c.beginPath(); c.ellipse(-8 + walk, 0, 9, 4, 0, 0, 6.2832); c.fill();
      c.beginPath(); c.ellipse(9 - walk, 0, 9, 4, 0, 0, 6.2832); c.fill();
    } else {
      c.beginPath(); c.moveTo(-6, hipY); c.lineTo(-14, hipY + 22); c.lineTo(-12, 0); c.stroke();
      c.beginPath(); c.moveTo(7, hipY); c.lineTo(14, hipY + 22); c.lineTo(13, 0); c.stroke();
      c.fillStyle = '#241a13';
      c.beginPath(); c.ellipse(-11, -1, 10, 4.5, -0.1, 0, 6.2832); c.fill();
      c.beginPath(); c.ellipse(15, -1, 10, 4.5, 0.1, 0, 6.2832); c.fill();
    }

    /* 棉袄 */
    var bodyG = c.createLinearGradient(-24, bodyTop, 24, hipY);
    bodyG.addColorStop(0, '#a04a3a');
    bodyG.addColorStop(0.45, '#8b3a2c');
    bodyG.addColorStop(1, '#62271f');
    c.fillStyle = bodyG;
    c.beginPath();
    c.moveTo(-20, bodyTop + 8);
    c.quadraticCurveTo(0, bodyTop - 4, 20, bodyTop + 8);
    c.quadraticCurveTo(26, hipY - 14, 22, hipY + 4);
    c.quadraticCurveTo(0, hipY + 12, -22, hipY + 4);
    c.quadraticCurveTo(-26, hipY - 14, -20, bodyTop + 8);
    c.closePath();
    c.fill();
    /* 衣襟 */
    c.strokeStyle = 'rgba(226,186,140,0.55)';
    c.lineWidth = 2;
    c.beginPath();
    c.moveTo(2, bodyTop + 4);
    c.quadraticCurveTo(10, bodyTop + 24, 4, hipY + 2);
    c.stroke();
    /* 盘扣 */
    c.fillStyle = 'rgba(232,196,150,0.75)';
    for (var b = 0; b < 3; b++) {
      c.beginPath(); c.arc(6, bodyTop + 20 + b * 16, 2, 0, 6.2832); c.fill();
    }
    /* 腰带 */
    c.fillStyle = 'rgba(64,44,30,0.9)';
    c.fillRect(-22, hipY - 10, 44, 8);
    c.fillStyle = 'rgba(198,158,110,0.4)';
    c.fillRect(-22, hipY - 10, 44, 2);

    /* 手臂 */
    c.strokeStyle = '#8b3a2c';
    c.lineWidth = 13;
    c.lineCap = 'round';
    var armLift = ch.arm || 0;
    if (ch.mode === 'feed' || ch.mode === 'flip') {
      c.beginPath();
      c.moveTo(16, bodyTop + 22);
      c.quadraticCurveTo(34, bodyTop + 10 - armLift * 14, 46 - ch.lean * 8, bodyTop + 2 - armLift * 10);
      c.stroke();
      c.fillStyle = '#e8c6a4';
      c.beginPath(); c.arc(48 - ch.lean * 8, bodyTop + 1 - armLift * 10, 6, 0, 6.2832); c.fill();
    } else {
      c.beginPath();
      c.moveTo(16, bodyTop + 22);
      c.quadraticCurveTo(28, bodyTop + 40, 24, hipY - 4);
      c.stroke();
      c.fillStyle = '#e8c6a4';
      c.beginPath(); c.arc(24, hipY - 2, 6, 0, 6.2832); c.fill();
    }
    c.beginPath();
    c.moveTo(-16, bodyTop + 22);
    c.quadraticCurveTo(-28, bodyTop + 40, -24, hipY - 6);
    c.stroke();
    c.fillStyle = '#e8c6a4';
    c.beginPath(); c.arc(-24, hipY - 4, 6, 0, 6.2832); c.fill();

    /* 手里的柴 */
    if (ch.hold > 0.05) {
      c.save();
      c.globalAlpha = ch.hold;
      c.strokeStyle = '#6b4a2c';
      c.lineWidth = 9;
      c.beginPath();
      c.moveTo(42, bodyTop - 2 - armLift * 10);
      c.lineTo(64, bodyTop + 8 - armLift * 10);
      c.stroke();
      c.strokeStyle = 'rgba(190,150,96,0.5)';
      c.lineWidth = 3;
      c.beginPath();
      c.moveTo(43, bodyTop - 4 - armLift * 10);
      c.lineTo(63, bodyTop + 6 - armLift * 10);
      c.stroke();
      c.restore();
    }

    /* 毛领 */
    var neckY = bodyTop + 4;
    c.fillStyle = '#e7d6b6';
    for (var fz = 0; fz < 7; fz++) {
      var ang2 = Math.PI * (0.05 + fz * 0.15);
      c.beginPath();
      c.arc(Math.cos(ang2) * 20, neckY - Math.sin(ang2) * 8, 5.6, 0, 6.2832);
      c.fill();
    }
    /* 围巾 */
    c.fillStyle = '#d8a55c';
    c.beginPath();
    c.ellipse(0, neckY + 8, 21, 10, 0, 0, 6.2832);
    c.fill();
    c.strokeStyle = 'rgba(148,98,40,0.35)';
    c.lineWidth = 1.2;
    c.beginPath(); c.ellipse(0, neckY + 11, 18, 6.5, 0, 0, 6.2832); c.stroke();
    var tailSwing = Math.sin(g.t * 2.2) * 3;
    c.fillStyle = '#c4914c';
    c.beginPath();
    c.moveTo(12, neckY + 6);
    c.quadraticCurveTo(23 + tailSwing, neckY + 30, 17 + tailSwing, neckY + 54);
    c.lineTo(7 + tailSwing, neckY + 52);
    c.quadraticCurveTo(12, neckY + 30, 2, neckY + 10);
    c.closePath();
    c.fill();
    c.strokeStyle = 'rgba(196,145,76,0.9)';
    c.lineWidth = 1.6;
    for (var f2 = 0; f2 < 3; f2++) {
      c.beginPath();
      c.moveTo(9 + f2 * 4 + tailSwing, neckY + 52);
      c.lineTo(8 + f2 * 4 + tailSwing, neckY + 58);
      c.stroke();
    }

    /* 脖子 */
    c.fillStyle = '#d9b28c';
    c.fillRect(-7, headY + 14, 14, 16);
    /* 头 */
    var faceX = 0, faceY = headY;
    c.fillStyle = '#eccaa6';
    c.beginPath();
    c.ellipse(faceX, faceY, 21, 21.5, 0, 0, 6.2832);
    c.fill();
    /* 头发 */
    c.fillStyle = '#281a14';
    c.beginPath();
    c.ellipse(faceX, faceY - 6, 21.8, 17.6, 0, Math.PI * 1.0, Math.PI * 2.0);
    c.fill();
    c.beginPath();
    c.ellipse(faceX - 18.5, faceY + 3, 5.6, 12, 0.1, 0, 6.2832);
    c.fill();
    c.beginPath();
    c.ellipse(faceX + 18.5, faceY + 3, 5.6, 12, -0.1, 0, 6.2832);
    c.fill();
    /* 发髻 */
    c.beginPath();
    c.arc(faceX - 5, faceY - 27, 10, 0, 6.2832);
    c.fill();
    c.fillStyle = '#c89a5e';
    c.fillRect(faceX - 18, faceY - 29, 24, 2.6);
    c.beginPath();
    c.arc(faceX - 18, faceY - 28, 2.6, 0, 6.2832);
    c.fill();

    /* 眉 */
    c.strokeStyle = 'rgba(66,44,28,0.55)';
    c.lineWidth = 1.4;
    c.beginPath(); c.moveTo(faceX - 10.5, faceY - 7); c.lineTo(faceX - 4.5, faceY - 8); c.stroke();
    c.beginPath(); c.moveTo(faceX + 4.5, faceY - 8); c.lineTo(faceX + 10.5, faceY - 7); c.stroke();
    /* 眼（会眨） */
    var blink = (Math.sin(g.t * 0.83 + 1.2) > 0.975) || g.warmth < 22;
    if (blink) {
      c.strokeStyle = '#3a281c';
      c.lineWidth = 1.9;
      c.beginPath(); c.moveTo(faceX - 10, faceY - 1); c.lineTo(faceX - 4.5, faceY - 1); c.stroke();
      c.beginPath(); c.moveTo(faceX + 4.5, faceY - 1); c.lineTo(faceX + 10, faceY - 1); c.stroke();
    } else {
      c.fillStyle = '#33241a';
      c.beginPath(); c.ellipse(faceX - 7, faceY - 1, 2.4, 2.9, 0, 0, 6.2832); c.fill();
      c.beginPath(); c.ellipse(faceX + 7, faceY - 1, 2.4, 2.9, 0, 0, 6.2832); c.fill();
      c.fillStyle = 'rgba(255,255,255,0.8)';
      c.beginPath(); c.arc(faceX - 7.8, faceY - 1.9, 0.9, 0, 6.2832); c.fill();
      c.beginPath(); c.arc(faceX + 6.2, faceY - 1.9, 0.9, 0, 6.2832); c.fill();
    }
    /* 鼻 */
    c.strokeStyle = 'rgba(190,140,110,0.7)';

    c.beginPath(); c.moveTo(faceX, faceY + 3); c.lineTo(faceX - 1.4, faceY + 5.5); c.stroke();
    /* 腮红 */
    c.fillStyle = 'rgba(212,118,96,0.32)';
    c.beginPath(); c.ellipse(faceX - 12, faceY + 7, 4.8, 3, 0, 0, 6.2832); c.fill();
    c.beginPath(); c.ellipse(faceX + 12, faceY + 7, 4.8, 3, 0, 0, 6.2832); c.fill();
    /* 嘴（火旺时笑） */
    c.strokeStyle = 'rgba(150,80,60,0.9)';
    c.lineWidth = 1.6;
    c.beginPath();
    if (g.fire > 40) c.arc(faceX, faceY + 8, 4.2, 0.3, Math.PI - 0.3);
    else { c.moveTo(faceX - 3, faceY + 11); c.lineTo(faceX + 3, faceY + 11); }
    c.stroke();

    c.restore();
  }

  /* =========================================================
   * 积雪
   * ======================================================= */
  function drawSnowAccum(g) {
    var c = ctx;
    var s = U.clamp(g.snow / 100, 0, 1);
    if (s <= 0.005) return;

    /* 窗台积雪 */
    var si = L.sill;
    var hgt = 6 + s * 30;
    c.save();
    c.beginPath();
    c.moveTo(si.x - 2, si.y + 2);
    c.lineTo(si.x - 2, si.y - hgt * 0.35);
    for (var x = 0; x <= si.w; x += 8) {
      var t = x / si.w;
      var hump = Math.sin(t * Math.PI) * (0.55 + 0.45 * Math.sin(g.t * 0.5 + t * 6));
      var y = si.y - hgt * (0.25 + hump * 0.75);
      c.lineTo(si.x + x, y);
    }
    c.lineTo(si.x + si.w + 2, si.y + 2);
    c.closePath();
    var sg = c.createLinearGradient(0, si.y - hgt, 0, si.y + 4);
    sg.addColorStop(0, 'rgba(238,247,255,0.95)');
    sg.addColorStop(0.6, 'rgba(206,226,246,0.92)');
    sg.addColorStop(1, 'rgba(150,180,214,0.7)');
    c.fillStyle = sg;
    c.fill();
    /* 雪面砂光 */
    c.fillStyle = 'rgba(255,255,255,0.55)';
    c.beginPath();
    c.ellipse(si.x + si.w * 0.32, si.y - hgt * 0.72, si.w * 0.16, Math.max(1.4, hgt * 0.12), 0, 0, 6.2832);
    c.fill();
    c.restore();

    /* 玻璃内的雪堆 */
    var gl = L.glass;
    var bh = 4 + s * 42;
    c.save();
    c.beginPath();
    c.rect(gl.x, gl.y, gl.w, gl.h);
    c.clip();
    c.beginPath();
    c.moveTo(gl.x, gl.y + gl.h);
    c.lineTo(gl.x, gl.y + gl.h - bh * 0.4);
    for (var x2 = 0; x2 <= gl.w; x2 += 10) {
      var tt = x2 / gl.w;
      var hh = bh * (0.3 + 0.7 * (0.5 + 0.5 * Math.sin(tt * 4.2 + 1.2)) * (0.4 + 0.6 * Math.sin(tt * Math.PI)));
      c.lineTo(gl.x + x2, gl.y + gl.h - hh);
    }
    c.lineTo(gl.x + gl.w, gl.y + gl.h);
    c.closePath();
    var bg = c.createLinearGradient(0, gl.y + gl.h - bh, 0, gl.y + gl.h);
    bg.addColorStop(0, 'rgba(240,248,255,0.9)');
    bg.addColorStop(1, 'rgba(160,190,222,0.75)');
    c.fillStyle = bg;
    c.fill();
    c.restore();

    /* 门缝的雪堆 */
    var d = L.door;
    if (s > 0.02) {
      var dh = 3 + s * 12;
      c.fillStyle = 'rgba(226,240,255,0.75)';
      c.beginPath();
      c.moveTo(d.x - 2, d.y + d.h);
      c.lineTo(d.x - 2, d.y + d.h - dh * 0.5);
      for (var x3 = 0; x3 <= d.w; x3 += 10) {
        c.lineTo(d.x + x3, d.y + d.h - dh * (0.35 + 0.65 * Math.abs(Math.sin(x3 * 0.06 + 2))));
      }
      c.lineTo(d.x + d.w + 2, d.y + d.h);
      c.closePath();
      c.fill();
    }
  }

  /* =========================================================
   * 剩余粒子（烟、雪末、柴屑）
   * ======================================================= */
  function drawParticles(g) {
    var c = ctx;
    /* 地板碎屑 */
    c.fillStyle = 'rgba(120,86,54,0.35)';
    for (var i = 0; i < grass.length; i++) {
      var gr = grass[i];
      c.fillRect(gr[0], gr[1], gr[2], 1.6);
    }
    /* 灌进屋的雪 */
    for (var k = 0; k < drafts.length; k++) {
      var d = drafts[k];
      if (d.life <= 0) continue;
      c.fillStyle = 'rgba(226,240,255,' + (d.life / d.max) * 0.75 + ')';
      c.beginPath();
      c.arc(d.x, d.y, d.r, 0, 6.2832);
      c.fill();
    }
  }

  /* =========================================================
   * 光
   * ======================================================= */
  function drawLight(g) {
    var c = ctx;
    var f = U.clamp(g.fire / 100, 0, 1);
    var flick = 0.88 + 0.12 * U.noise(g.t * 7.3);
    var fb = L.firebox;
    var cx = fb.x + fb.w / 2, cy = fb.y + fb.h * 0.72;

    c.save();
    c.globalCompositeOperation = 'lighter';

    /* 窗外透进来的冷光 */
    var winGlow = c.createRadialGradient(1008, 306, 20, 1008, 306, 440);
    winGlow.addColorStop(0, 'rgba(118,168,232,' + (0.052 + g.snow * 0.0005) + ')');
    winGlow.addColorStop(0.55, 'rgba(108,158,225,' + (0.024 + g.snow * 0.0002) + ')');
    winGlow.addColorStop(1, 'rgba(100,150,220,0)');
    c.fillStyle = winGlow;
    c.beginPath();
    c.arc(1008, 306, 440, 0, 6.2832);
    c.fill();

    /* 火光主光 */
    var rad = 300 + f * 300;
    var gl = c.createRadialGradient(cx, cy, 20, cx, cy, rad);
    gl.addColorStop(0, 'rgba(255,178,96,' + (0.30 * f * flick) + ')');
    gl.addColorStop(0.35, 'rgba(255,140,62,' + (0.15 * f * flick) + ')');
    gl.addColorStop(0.7, 'rgba(210,90,40,' + (0.05 * f) + ')');
    gl.addColorStop(1, 'rgba(180,60,20,0)');
    c.fillStyle = gl;
    c.beginPath();
    c.arc(cx, cy, rad, 0, 6.2832);
    c.fill();

    /* 地面光池 */
    var pool = c.createRadialGradient(cx, 690, 10, cx, 690, 330);
    pool.addColorStop(0, 'rgba(255,164,80,' + (0.16 * f * flick) + ')');
    pool.addColorStop(1, 'rgba(255,140,60,0)');
    c.fillStyle = pool;
    c.beginPath();
    c.ellipse(cx, 690, 330, 56, 0, 0, 6.2832);
    c.fill();

    /* 墙上的暖斑 */
    var wallP = c.createRadialGradient(cx, 300, 20, cx, 300, 240);
    wallP.addColorStop(0, 'rgba(255,150,70,' + (0.09 * f * flick) + ')');
    wallP.addColorStop(1, 'rgba(255,140,60,0)');
    c.fillStyle = wallP;
    c.beginPath();
    c.arc(cx, 300, 240, 0, 6.2832);
    c.fill();

    /* 天亮 */
    if (g.dawnT > 0) {
      var dg = c.createLinearGradient(0, 720, 0, 120);
      dg.addColorStop(0, 'rgba(255,196,138,' + 0.34 * g.dawnT + ')');
      dg.addColorStop(0.5, 'rgba(255,206,160,' + 0.13 * g.dawnT + ')');
      dg.addColorStop(1, 'rgba(180,206,240,' + 0.10 * g.dawnT + ')');
      c.fillStyle = dg;
      c.fillRect(0, 0, 1280, 720);
    }
    c.restore();

    /* 冷色（温暖低时逐步压上来） */
    var cold = U.clamp((55 - g.warmth) / 55, 0, 1) * (g.phase === 'title' ? 0.35 : 1);
    if (cold > 0.01) {
      c.save();
      c.globalCompositeOperation = 'multiply';
      var cg = c.createLinearGradient(0, 0, 0, 720);
      var a = cold * 0.55;
      cg.addColorStop(0, 'rgba(' + (128 - 34 * cold) + ',' + (156 - 20 * cold) + ',' + (196 - 10 * cold) + ',' + a + ')');
      cg.addColorStop(1, 'rgba(' + (150 - 34 * cold) + ',' + (170 - 20 * cold) + ',' + (200 - 10 * cold) + ',' + (a * 0.85) + ')');
      c.fillStyle = cg;
      c.fillRect(0, 0, 1280, 720);
      c.restore();
      /* 冷蓝轻纱 */
      c.fillStyle = 'rgba(96,140,196,' + (cold * 0.10) + ')';
      c.fillRect(0, 0, 1280, 720);
    }
  }

  /* =========================================================
   * 提示 / 悬停
   * ======================================================= */
  var HOTS = null;
  Scene.setHots = function (arr) { HOTS = arr; };

  function drawHints(g) {
    var c = ctx;
    if (!HOTS) return;
    for (var i = 0; i < HOTS.length; i++) {
      var h = HOTS[i];
      if (!h.active || !h.show) continue;
      var pulse = 0.5 + 0.5 * Math.sin(g.t * 3.4 + i);
      c.save();
      if (h.kind === 'circle') {
        c.strokeStyle = 'rgba(255,214,144,' + (0.24 + pulse * 0.4) + ')';
        c.lineWidth = 2 + pulse * 1.6;
        c.setLineDash([7, 8]);
        c.beginPath();
        c.arc(h.x, h.y, h.r + pulse * 5, 0, 6.2832);
        c.stroke();
        c.setLineDash([]);
      } else {
        c.strokeStyle = 'rgba(255,214,144,' + (0.18 + pulse * 0.34) + ')';
        c.lineWidth = 2 + pulse * 1.2;
        U.roundRect(c, h.x, h.y, h.w, h.h, 8);
        c.stroke();
      }
      /* 上浮小点 */
      var fy = h.y - 10 - ((g.t * 26 + i * 40) % 40);
      c.fillStyle = 'rgba(255,224,168,' + (0.5 * pulse) + ')';
      c.beginPath();
      c.arc(h.x + h.w / 2, fy, 2.6, 0, 6.2832);
      c.fill();
      c.restore();
    }

    /* 悬停标签 */
    if (g.hover && g.hoverLabel) {
      var hh = null;
      for (var k = 0; k < HOTS.length; k++) {
        if (HOTS[k].id === g.hover) { hh = HOTS[k]; break; }
      }
      if (hh) {
        var lx = hh.kind === 'circle' ? hh.x : hh.x + hh.w / 2;
        var ly = (hh.kind === 'circle' ? hh.y - hh.r : hh.y) - 22;
        var txt = g.hoverLabel;
        c.font = '15px "KaiTi","STKaiti",楷体,serif';
        var tw = 22;
        try { tw = c.measureText(txt).width + 26; } catch (e) {}
        c.save();
        c.fillStyle = 'rgba(10,8,6,0.72)';
        U.roundRect(c, lx - tw / 2, ly - 20, tw, 26, 4);
        c.fill();
        c.strokeStyle = 'rgba(214,176,112,0.45)';
        c.lineWidth = 1;
        U.roundRect(c, lx - tw / 2, ly - 20, tw, 26, 4);
        c.stroke();
        c.fillStyle = 'rgba(246,232,206,0.95)';
        c.textAlign = 'center';
        c.textBaseline = 'middle';
        c.fillText(txt, lx, ly - 7);
        c.textAlign = 'left';
        c.textBaseline = 'alphabetic';
        c.restore();
      }
    }
    /* 糍粑可翻的提示环 */
    if (g.cakeReady) {
      var p = L.pan;
      var pp = 0.5 + 0.5 * Math.sin(g.t * 7);
      c.save();
      c.globalCompositeOperation = 'lighter';
      c.strokeStyle = 'rgba(255,214,120,' + (0.3 + pp * 0.5) + ')';
      c.lineWidth = 2.5;
      c.beginPath();
      c.arc(p.x, p.y - 8, p.r + 6 + pp * 6, 0, 6.2832);
      c.stroke();
      c.restore();
    }
  }

  function drawFloaters(g) {
    var c = ctx;
    if (!g.floaters) return;
    for (var i = 0; i < g.floaters.length; i++) {
      var f = g.floaters[i];
      var lp = 1 - f.life / f.max;
      c.save();
      c.globalAlpha = Math.min(1, (1 - lp) * 2.2);
      c.font = (f.big ? '26px ' : '20px ') + '"KaiTi","STKaiti",楷体,serif';
      c.textAlign = 'center';
      c.fillStyle = 'rgba(0,0,0,0.55)';
      c.fillText(f.text, f.x + 1.5, f.y - lp * 46 + 2.5);
      c.fillStyle = f.color || '#ffe0a8';
      c.fillText(f.text, f.x, f.y - lp * 46);
      c.restore();
    }
  }

  /* =========================================================
   * 后期：晕影 / 颗粒 / 遮罩
   * ======================================================= */
  function drawPost(g) {
    var c = ctx;
    if (Art.vig) c.drawImage(Art.vig.c, 0, 0);
    if (patternGrain) {
      c.save();
      c.globalAlpha = 0.045;
      c.globalCompositeOperation = 'overlay';
      c.fillStyle = patternGrain;
      c.fillRect(0, 0, 1280, 720);
      c.restore();
    }
    if (g.dim > 0.001) {
      c.fillStyle = 'rgba(4,6,11,' + g.dim * 0.62 + ')';
      c.fillRect(0, 0, 1280, 720);
    }
  }
})();
